limit_req_zone $binary_remote_addr zone=mp_image_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mp_image_connections:10m;

server {
    listen 80;
    server_name mp.togma.online;
    return 301 https://mp.togma.online$request_uri;
}
server {
    listen 443 ssl http2;
    server_name mp.togma.online;
    root /var/www/mp.togma.online;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/mp.togma.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mp.togma.online/privkey.pem;
    location /api/ {
        client_max_body_size 16k;
        limit_req zone=mp_image_requests burst=20;
        limit_req_status 429;
        limit_conn mp_image_connections 8;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:4318;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4318;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 35s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location / { try_files $uri $uri/ =404; }
}

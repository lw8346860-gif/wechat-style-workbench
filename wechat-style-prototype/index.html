<!doctype html>
<html lang="zh-CN" data-color-mode="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    const requestedPageView = new URLSearchParams(window.location.search).get('view');
    const mobileBrowser = navigator.userAgentData?.mobile === true
      || /Android|iPhone|iPod|Windows Phone|Mobile/i.test(navigator.userAgent)
      || window.matchMedia('(max-width: 760px)').matches;
    if (!requestedPageView && mobileBrowser) {
      window.location.replace(new URL('mobile.html', window.location.href).href);
    }
    if (requestedPageView === 'desktop') {
      document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=1200');
      document.documentElement.dataset.pageView = 'desktop';
    } else if (requestedPageView === 'mobile') {
      document.documentElement.dataset.pageView = 'mobile';
    }
  </script>
  <title>公众号操作台</title>
  <style>
    :root {
      color-scheme: light;
      --orange: #ff6827;
      --orange-soft: #fff2eb;
      --ink: #292724;
      --muted: #77716a;
      --line: #e8e2d9;
      --paper: #ffffff;
      --canvas: #f4f1eb;
      --ok: #227a52;
      --warn: #ad5a19;
      --control: #ffffff;
      --surface-cool: #f8fafc;
      --step-bg: #eaf0f6;
      --step-ink: #486580;
      --soft-surface: #f7f7f7;
      --quick-a: #fffaf7;
      --quick-b: #ffffff;
      --toolbar-bg: rgba(255, 255, 255, 0.96);
      --editor-wash-a: #fdfcf9;
      --editor-wash-b: #f3f0ea;
      --control-hover: #f5f2ed;
      --control-hover-ink: #24211e;
      --status-bg: #f2f4f2;
      --warning-bg: #fff6eb;
      --code-bg: #faf9f7;
      --article-paper: #ffffff;
      --article-ink: #333333;
      --article-author: #888888;
      --article-secondary: #666666;
      --article-line: #eee9e1;
    }

    :root[data-color-mode="dark"] {
      color-scheme: dark;
      --ink: #eee9e2;
      --muted: #aaa299;
      --line: #403c37;
      --paper: #211f1c;
      --canvas: #151412;
      --ok: #6bc99a;
      --warn: #e0a06c;
      --control: #2a2825;
      --surface-cool: #1b2025;
      --step-bg: #2a3743;
      --step-ink: #b8d2e8;
      --soft-surface: #262421;
      --quick-a: #241c18;
      --quick-b: #211f1c;
      --toolbar-bg: rgba(33, 31, 28, 0.96);
      --editor-wash-a: #2a2722;
      --editor-wash-b: #171614;
      --control-hover: #34312d;
      --control-hover-ink: #ffffff;
      --status-bg: #1e2b25;
      --warning-bg: #34261c;
      --code-bg: #191816;
      --article-paper: #232323;
      --article-ink: rgba(255, 255, 255, .82);
      --article-author: rgba(255, 255, 255, .46);
      --article-secondary: rgba(255, 255, 255, .68);
      --article-line: #383838;
    }

    @media (prefers-color-scheme: dark) {
      :root[data-color-mode="system"] {
        color-scheme: dark;
        --ink: #eee9e2;
        --muted: #aaa299;
        --line: #403c37;
        --paper: #211f1c;
        --canvas: #151412;
        --ok: #6bc99a;
        --warn: #e0a06c;
        --control: #2a2825;
        --surface-cool: #1b2025;
        --step-bg: #2a3743;
        --step-ink: #b8d2e8;
        --soft-surface: #262421;
        --quick-a: #241c18;
        --quick-b: #211f1c;
        --toolbar-bg: rgba(33, 31, 28, 0.96);
        --editor-wash-a: #2a2722;
        --editor-wash-b: #171614;
        --control-hover: #34312d;
        --control-hover-ink: #ffffff;
        --status-bg: #1e2b25;
        --warning-bg: #34261c;
        --code-bg: #191816;
        --article-paper: #232323;
        --article-ink: rgba(255, 255, 255, .82);
        --article-author: rgba(255, 255, 255, .46);
        --article-secondary: rgba(255, 255, 255, .68);
        --article-line: #383838;
      }
    }

    * { box-sizing: border-box; }
    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 12px;
      background: var(--control);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { border-color: var(--muted); }
    button.primary { border-color: var(--orange); background: var(--orange); color: #fff; }
    button.primary:hover { filter: brightness(.92); }

    .app-shell {
      width: min(1460px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      position: relative;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--orange);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .maker-meta {
      position: absolute;
      top: 23px;
      right: 0;
      margin: 0;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .maker-meta span { margin-left: 6px; color: var(--orange); }

    h1 { margin: 0; font-size: 25px; line-height: 1.25; }
    .brand-title-row { display: flex; align-items: center; gap: 9px; }
    .wechat-assistant-logo {
      position: relative;
      display: inline-block;
      width: 29px;
      height: 29px;
      flex: 0 0 29px;
      border-radius: 9px;
      background: #07c160;
      box-shadow: 0 5px 13px rgba(7, 193, 96, .2), inset 0 0 0 1px rgba(0, 0, 0, .04);
    }
    .wechat-assistant-logo::before,
    .wechat-assistant-logo::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background-color: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
    }
    .wechat-assistant-logo::before {
      left: 4px;
      top: 6px;
      width: 14px;
      height: 11px;
      background-image:
        radial-gradient(circle at 35% 45%, #07c160 0 1.1px, transparent 1.3px),
        radial-gradient(circle at 65% 45%, #07c160 0 1.1px, transparent 1.3px);
    }
    .wechat-assistant-logo::after {
      right: 4px;
      bottom: 5px;
      width: 12px;
      height: 9px;
      background-image:
        radial-gradient(circle at 35% 45%, #07c160 0 1px, transparent 1.2px),
        radial-gradient(circle at 65% 45%, #07c160 0 1px, transparent 1.2px);
    }

    .subline {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .header-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .header-action-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 12px;
      background: var(--control);
      color: var(--ink);
      font-size: 14px;
      font-weight: 650;
      line-height: normal;
      text-decoration: none;
    }
    .header-action-link:hover { border-color: var(--muted); }
    .header-actions .full-version-link { display: none; }
    .header-icon-control {
      width: 40px;
      min-width: 40px;
      height: 36px;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }
    .appearance-toggle { gap: 0; }
    .appearance-icon {
      display: block;
      width: 18px;
      height: 18px;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      background: linear-gradient(90deg, #fff 50%, #1e1d1b 50%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
    }
    .appearance-icon[data-mode="light"] { background: #fff; }
    .appearance-icon[data-mode="dark"] { background: #1e1d1b; }

    .header-symbol { position: relative; display: block; color: currentColor; }
    .phone-header-icon {
      width: 13px;
      height: 21px;
      border: 2px solid currentColor;
      border-radius: 3px;
    }
    .phone-header-icon::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: 3px;
      height: 1.5px;
      transform: translateX(-50%);
      border-radius: 2px;
      background: currentColor;
    }
    .pc-header-icon {
      width: 20px;
      height: 14px;
      margin-bottom: 4px;
      border: 2px solid currentColor;
      border-radius: 2px;
    }
    .pc-header-icon::before {
      content: '';
      position: absolute;
      left: 8px;
      bottom: -6px;
      width: 2px;
      height: 5px;
      background: currentColor;
    }
    .pc-header-icon::after {
      content: '';
      position: absolute;
      left: 4px;
      bottom: -7px;
      width: 10px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
    }
    .restore-header-icon {
      width: 21px;
      height: 21px;
      display: grid;
      place-items: center;
      font: 400 23px/1 "Segoe UI Symbol", "Arial Unicode MS", sans-serif;
    }
    .restore-header-icon::before { content: '↶'; transform: translateY(-1px); }
    .search-header-icon {
      width: 15px;
      height: 15px;
      margin: -3px 0 0 -3px;
      border: 2px solid currentColor;
      border-radius: 50%;
    }
    .search-header-icon::after {
      content: '';
      position: absolute;
      right: -7px;
      bottom: -5px;
      width: 8px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transform: rotate(45deg);
      transform-origin: left center;
    }
    .audit-header-icon {
      width: 18px;
      height: 18px;
      border: 2px solid currentColor;
      border-radius: 5px;
    }
    .audit-header-icon::before {
      content: '';
      position: absolute;
      left: 4px;
      top: 4px;
      width: 6px;
      height: 1.5px;
      border-radius: 2px;
      background: currentColor;
      box-shadow: 0 4px 0 currentColor, 0 8px 0 currentColor;
    }
    .audit-header-icon::after { display: none; }
    .identify-header-icon {
      display: grid;
      place-items: center;
      width: 19px;
      height: 19px;
      border: 1.5px solid currentColor;
      border-radius: 5px;
    }
    .identify-header-icon::before {
      content: '识';
      font: 700 12px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .format-header-icon { width: 20px; height: 20px; }
    .format-header-icon::before {
      content: '';
      position: absolute;
      left: 2px;
      bottom: 4px;
      width: 14px;
      height: 2px;
      border-radius: 4px;
      background: currentColor;
      transform: rotate(-45deg);
      transform-origin: center;
    }
    .format-header-icon::after {
      content: '✦';
      position: absolute;
      top: -3px;
      right: -1px;
      font: 700 11px/1 Georgia, serif;
    }

    .document-search {
      position: fixed;
      right: 24px;
      top: 118px;
      z-index: 50;
      display: grid;
      grid-template-columns: minmax(180px, 250px) auto repeat(3, 30px);
      align-items: center;
      gap: 5px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--control);
      box-shadow: 0 18px 45px rgba(42, 34, 26, .18);
    }
    .document-search[hidden] { display: none; }
    .document-search input {
      width: 100%;
      height: 30px;
      min-width: 0;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      outline: none;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
    }
    .document-search input:focus { border-color: var(--orange); box-shadow: 0 0 0 2px color-mix(in srgb, var(--orange) 15%, transparent); }
    .document-search-count { min-width: 42px; color: var(--muted); font-size: 11px; text-align: center; font-variant-numeric: tabular-nums; }
    .document-search button { width: 30px; height: 30px; padding: 0; border-radius: 7px; font-size: 15px; }
    .document-search button:disabled { opacity: .35; cursor: default; }
    ::highlight(document-search-all) { background-color: rgba(255, 218, 105, .48); }
    ::highlight(document-search-current) { background-color: #ffb24d; color: #211a13; text-decoration: underline; }

    .mobile-publish-preview {
      position: fixed;
      right: 24px;
      top: 118px;
      z-index: 49;
      width: 342px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--control);
      box-shadow: 0 24px 65px rgba(34, 28, 22, .25);
    }
    .mobile-publish-preview[hidden] { display: none; }
    .mobile-publish-preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 2px 4px 9px;
    }
    .mobile-publish-preview-head strong { font-size: 12px; }
    .mobile-publish-preview-head span { margin-left: 5px; color: var(--muted); font-size: 10px; font-weight: 500; }
    .mobile-publish-preview-head button { width: 26px; height: 26px; padding: 0; border: 0; background: transparent; font-size: 17px; }
    .publish-preview-phone {
      position: relative;
      height: min(680px, calc(100vh - 180px));
      min-height: 480px;
      padding: 10px;
      border-radius: 38px;
      background: #111;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
    }
    .publish-preview-phone::before {
      content: '';
      position: absolute;
      top: 18px;
      left: 50%;
      z-index: 2;
      width: 86px;
      height: 22px;
      transform: translateX(-50%);
      border-radius: 14px;
      background: #070707;
      pointer-events: none;
    }
    .publish-preview-screen {
      height: 100%;
      overflow: auto;
      padding: 0;
      border-radius: 29px;
      background: var(--article-paper);
      color: var(--article-ink);
      scrollbar-width: thin;
    }
    .publish-preview-viewport {
      width: 390px;
      min-height: 100%;
      padding: 48px 20px 44px;
      background: var(--article-paper);
      color: var(--article-ink);
      font-size: 16px;
      transform-origin: left top;
    }
    .publish-preview-viewport > :first-child { margin-top: 0 !important; }
    .publish-preview-viewport > :not([data-wechat-role="chapter-title"]),
    .editor-page > :not([data-wechat-role="chapter-title"]) { color: var(--article-ink) !important; }
    .publish-preview-viewport > :not([data-wechat-role="chapter-title"]) :where(span, font),
    .editor-page > :not([data-wechat-role="chapter-title"]) :where(span, font) { color: inherit !important; }
    .publish-preview-screen [data-wechat-role="body"],
    .editor-page [data-wechat-role="body"] { color: var(--article-ink) !important; }
    .publish-preview-screen [data-wechat-role="author"],
    .editor-page [data-wechat-role="author"] { color: var(--article-author) !important; }
    .publish-preview-screen [data-wechat-role="intro"],
    .editor-page [data-wechat-role="intro"] { color: var(--article-ink) !important; }
    .publish-preview-screen [data-wechat-role="quote"],
    .editor-page [data-wechat-role="quote"] { color: var(--article-secondary) !important; }
    .publish-preview-screen :is([data-wechat-role="author"], [data-wechat-role="intro"], [data-wechat-role="quote"]) *,
    .editor-page :is([data-wechat-role="author"], [data-wechat-role="intro"], [data-wechat-role="quote"]) * { color: inherit !important; }
    .publish-preview-screen :is(strong, b, mark, [data-wechat-role="emphasis"], [data-wechat-role="emphasis-blue"], [data-wechat-role="emphasis-color"]),
    .editor-page :is(strong, b, mark, [data-wechat-role="emphasis"], [data-wechat-role="emphasis-blue"], [data-wechat-role="emphasis-color"]) { color: var(--orange) !important; }
    .publish-preview-screen [data-wechat-role="chapter-title"],
    .editor-page [data-wechat-role="chapter-title"] { color: var(--orange) !important; }
    .publish-preview-screen [data-wechat-title-part="box"],
    .editor-page [data-wechat-title-part="box"] { color: #ffffff !important; }
    .publish-preview-screen [data-wechat-title-part="box"] {
      display: inline !important;
      width: auto !important;
      padding: 2px 5px !important;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .agent-intake {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      align-items: stretch;
      margin-bottom: 10px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .agent-flow-card,
    .agent-prompt-card,
    .intake-learning-card {
      position: relative;
      display: grid;
      grid-template-rows: 16px minmax(0, 1fr);
      flex: 0 0 62px;
      gap: 2px;
      min-width: 0;
      height: 62px;
      min-height: 62px;
      max-height: 62px;
      padding: 4px 0;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--orange) 22%, var(--line));
      border-radius: 8px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--orange) 8%, var(--control)), var(--control) 68%);
      box-shadow: 0 7px 18px color-mix(in srgb, var(--orange) 7%, transparent);
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .agent-module-stack {
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
    }
    .agent-prompt-card:focus-within,
    .agent-flow-card:focus-within,
    .intake-learning-card:focus-within {
      border-color: var(--orange);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--orange) 13%, transparent);
    }

    .agent-prompt-card,
    .agent-flow-card,
    .intake-learning-card { align-content: stretch; }
    .agent-flow-card .agent-help { display: none; }
    .intake-learning-card .panel-note { display: none; }
    .intake-learning-card { align-content: start; }
    .agent-step-head { display: flex; align-items: center; gap: 5px; min-height: 16px; padding: 0 8px; }
    .agent-step-head strong { font-size: 12px; line-height: 1.15; }
    .agent-step {
      display: inline-grid;
      place-items: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--step-bg);
      color: var(--step-ink);
      font-size: 9px;
      font-weight: 800;
    }
    .agent-help { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .compact-input-wrap,
    .agent-input-wrap,
    .style-learning-paste-row {
      --compact-action-width: 50px;
      position: static;
      display: block;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: visible;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .style-learning-paste-row { --compact-action-width: 50px; }

    .compact-input-field,
    .agent-input,
    .style-sample,
    .agent-prompt-editor {
      width: 100%;
      min-height: 0;
      height: 100%;
      max-height: 100%;
      overflow: auto;
      resize: none;
      padding: 5px calc(var(--compact-action-width) + 26px) 5px 8px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      outline: none;
      font: 11px/1.35 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--muted) 48%, transparent) transparent;
    }
    .compact-input-field::-webkit-scrollbar,
    .agent-input::-webkit-scrollbar,
    .style-sample::-webkit-scrollbar,
    .agent-prompt-editor::-webkit-scrollbar { width: 5px; height: 5px; }
    .compact-input-field::-webkit-scrollbar-thumb,
    .agent-input::-webkit-scrollbar-thumb,
    .style-sample::-webkit-scrollbar-thumb,
    .agent-prompt-editor::-webkit-scrollbar-thumb { border-radius: 5px; background: color-mix(in srgb, var(--muted) 48%, transparent); }
    .compact-input-field:focus,
    .agent-input:focus,
    .style-sample:focus,
    .agent-prompt-editor:focus {
      box-shadow: none;
    }
    .agent-prompt-editor {
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 11px;
      line-height: 1.35;
    }
    .compact-input-wrap > button,
    .agent-input-wrap > button,
    .style-learning-paste-row > button {
      position: absolute;
      top: 0;
      right: 16px;
      bottom: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      width: var(--compact-action-width);
      min-width: var(--compact-action-width);
      height: 24px;
      margin: auto 0;
      padding: 0 8px;
      transform: none;
      border: 0;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1;
    }
    .agent-copy-button { width: var(--compact-action-width); }

    .agent-module-status {
      display: block;
      min-height: 0;
      margin: 3px 6px 0;
      overflow: hidden;
      color: var(--ok);
      font-size: 8px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .agent-module-status:empty { display: none; }

    .agent-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .agent-flow-card .agent-actions { justify-content: space-between; }
    .agent-actions small { min-height: 18px; color: var(--ok); font-size: 11px; text-align: center; }

    .side { display: grid; gap: 14px; }

  <script>
    // The mobile route uses the same document and editor logic, but activates the
    // responsive rules even when it is opened from a wide desktop browser.
    if (document.documentElement.dataset.pageView === 'mobile') {
      const forcedMobileCss = [];
      for (const sheet of document.styleSheets) {
        let rules;
        try { rules = sheet.cssRules; } catch (_) { continue; }
        for (const rule of rules) {
          if (!(rule instanceof CSSMediaRule)) continue;
          if (!/max-width\s*:\s*(?:1020|980|760)px/i.test(rule.conditionText)) continue;
          for (const nestedRule of rule.cssRules) forcedMobileCss.push(nestedRule.cssText);
        }
      }
      const mobileStyle = document.createElement('style');
      mobileStyle.dataset.forcedMobileRules = '';
      mobileStyle.textContent = forcedMobileCss.join('\n');
      document.head.appendChild(mobileStyle);
    }

    <h1>公众号操作台新手指引</h1>
    <p>作者：松壑</p>
    <p>欢迎使用公众号操作台。你正在看到的是一篇可以随时修改或删除的示例文章，它会带你快速认识从原文到微信草稿的完整流程。</p>
    <p>这篇新手指引同时展示了正文、章节标题、主题色重点句和引用等格式。当你开始编辑或点击“清空开始”后，它不会再在以后刷新时出现。</p>

      function buildDocumentSearchIndex() {
        const entries = [];
        let text = '';
        const roots = [...editor.childNodes].filter((node) => node.nodeType === Node.TEXT_NODE || node.nodeType === Node.ELEMENT_NODE);

        roots.forEach((root, rootIndex) => {
          if (root.nodeType === Node.TEXT_NODE) {
            const value = root.nodeValue || '';
            if (value) {
              entries.push({ node: root, start: text.length, end: text.length + value.length });
              text += value;
            }
          } else {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            while (walker.nextNode()) {
              const node = walker.currentNode;
              const value = node.nodeValue || '';
              if (!value) continue;
              entries.push({ node, start: text.length, end: text.length + value.length });
              text += value;
            }
          }
          if (rootIndex < roots.length - 1) text += '\n';
        });

        return { text, entries };
      }

      function rangeForSearchOffsets(entries, start, end) {
        const startEntry = entries.find((entry) => start >= entry.start && start < entry.end);
        const endEntry = entries.find((entry) => end > entry.start && end <= entry.end);
        if (!startEntry || !endEntry) return null;
        const range = document.createRange();
        range.setStart(startEntry.node, start - startEntry.start);
        range.setEnd(endEntry.node, end - endEntry.start);
        return range;
      }

      function paintDocumentSearchHighlights() {
        clearDocumentSearchHighlights();
        const currentRange = documentSearchRanges[documentSearchIndex];
        if (!currentRange) return;
        if (window.CSS?.highlights && typeof window.Highlight === 'function') {
          CSS.highlights.set('document-search-all', new Highlight(...documentSearchRanges));
          CSS.highlights.set('document-search-current', new Highlight(currentRange));
        } else {
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(currentRange);
          documentSearchUsesSelection = true;
        }
      }

      function focusDocumentSearchMatch() {
        paintDocumentSearchHighlights();
        const range = documentSearchRanges[documentSearchIndex];
        if (!range) return;
        const target = range.startContainer.nodeType === Node.TEXT_NODE
          ? range.startContainer.parentElement
          : range.startContainer;
        target?.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
      }

      function updateDocumentSearch(resetIndex = true) {
        const query = documentSearchInput.value.trim();
        documentSearchRanges = [];

        if (query) {
          const { text, entries } = buildDocumentSearchIndex();
          const source = text.toLocaleLowerCase();
          const needle = query.toLocaleLowerCase();
          let offset = 0;
          while (offset <= source.length - needle.length) {
            const matchStart = source.indexOf(needle, offset);
            if (matchStart < 0) break;
            const range = rangeForSearchOffsets(entries, matchStart, matchStart + needle.length);
            if (range) documentSearchRanges.push(range);
            offset = matchStart + Math.max(needle.length, 1);
          }
        }

        if (resetIndex) documentSearchIndex = documentSearchRanges.length ? 0 : -1;
        else if (documentSearchIndex >= documentSearchRanges.length) documentSearchIndex = documentSearchRanges.length - 1;

        const hasResults = documentSearchRanges.length > 0;
        documentSearchCount.textContent = hasResults ? `${documentSearchIndex + 1} / ${documentSearchRanges.length}` : '0 / 0';
        searchPreviousButton.disabled = !hasResults;
        searchNextButton.disabled = !hasResults;
        focusDocumentSearchMatch();
      }

            const startX = event.clientX;
            const startWidth = editorResizeShell.getBoundingClientRect().width;
            const direction = handle.dataset.resizeEdge === 'left' ? -1 : 1;
            handle.setPointerCapture(event.pointerId);
            const move = (moveEvent) => setEditorWidth(startWidth + (moveEvent.clientX - startX) * direction * 2, false);

              handle.removeEventListener('pointermove', move);
              handle.removeEventListener('pointerup', finish);
              handle.removeEventListener('pointercancel', finish);
              setEditorWidth(editorResizeShell.getBoundingClientRect().width, true);

            handle.addEventListener('pointermove', move);

          if (!explicitEmphasis && Number(getComputedStyle(element).fontWeight) < 600) return;
          const keepItalic = getComputedStyle(element).fontStyle === 'italic';
          element.dataset.wechatRole = 'emphasis';
          element.setAttribute('style', emphasisStyle(element.style.fontFamily || selectedFontStack));
          if (keepItalic) element.style.fontStyle = 'italic';
          element.querySelectorAll('[style*="color"], font[color]').forEach((child) => {
            child.style.color = currentAccentColor;
            child.style.fontWeight = '700';
            child.removeAttribute('color');
          });
        });

        editor.querySelectorAll('span[style*="color"], font[color]').forEach((element) => {
          const themedParent = element.closest('[data-wechat-role="chapter-title"], [data-wechat-role="article-title"], strong, b, mark, [data-wechat-role="emphasis"]');
          if (!themedParent) {
            element.style.removeProperty('color');
            element.removeAttribute('color');
          }
        });

        [...editor.children].forEach((block) => {
          const role = block.dataset.wechatRole;
          if (role !== 'chapter-title' && role !== 'intro' && role !== 'quote') {
            block.style.color = role === 'author' ? '#888888' : BODY_COLOR;
          }
        });
      }

      function syncThemeColor() {
        const titleBlocks = [...editor.children]
          .filter((block) => block.dataset.wechatRole !== 'quote' && isTitleBlock(block));
        titleBlocks.forEach((block) => {
          block.dataset.wechatRole = 'chapter-title';
          block.setAttribute('style', titleStyle(block.style.fontFamily || selectedFontStack));
          const numberPart = block.querySelector('[data-wechat-title-part="number"]');
          const boxPart = block.querySelector('[data-wechat-title-part="box"]');
          block.querySelectorAll('*').forEach((child) => {
            child.style.fontWeight = '700';
            child.removeAttribute('color');
            if (boxPart && (child === boxPart || boxPart.contains(child))) {
              child.style.color = '#ffffff';
              if (child === boxPart) child.style.backgroundColor = currentTitleColor;
            } else {
              child.style.color = currentTitleColor;
              if (child === numberPart) child.style.backgroundColor = 'transparent';
            }
          });
        });

        editor.querySelectorAll('[data-wechat-role="article-title"]').forEach((block) => {
          block.setAttribute('style', articleTitleStyle(block.style.fontFamily || selectedFontStack));
        });

        syncThemeEmphasis();
        editor.querySelectorAll('[data-wechat-role="intro"]').forEach((block) => block.setAttribute('style', introStyle(block.style.fontFamily || selectedFontStack)));
        editor.querySelectorAll('[data-wechat-role="quote"]').forEach((block) => block.setAttribute('style', quoteStyle(block.style.fontFamily || selectedFontStack)));
      }

      function detectTopAuthorLine() {
        const firstBlock = [...editor.children].find((block) => block.textContent.trim());
        if (!firstBlock || !authorPattern.test(firstBlock.textContent.trim())) return false;
        firstBlock.dataset.wechatRole = 'author';
        firstBlock.setAttribute('style', authorStyle(firstBlock.style.fontFamily || selectedFontStack));
        return true;
      }

      function rememberEditorSelection() {
        if (!documentSearch.hidden) return;
        const selection = window.getSelection();
        if (!selection.rangeCount || selection.isCollapsed || !editor.contains(selection.anchorNode) || !editor.contains(selection.focusNode)) return;
        const range = selection.getRangeAt(0);
        savedEditorRange = range.cloneRange();
        lastToolbarBlocks = blocksForRange(range);
      }

      function restoreEditorSelection() {
        const selection = window.getSelection();
        const currentIsInEditor = selection.rangeCount && editor.contains(selection.anchorNode) && editor.contains(selection.focusNode);
        if (currentIsInEditor && !selection.isCollapsed) return true;
        if (savedEditorRange) {
          try {
            if (editor.contains(savedEditorRange.commonAncestorContainer)) {
              selection.removeAllRanges();
              selection.addRange(savedEditorRange);
              return true;
            }
          } catch {
            savedEditorRange = null;
          }
        }
        return currentIsInEditor;
      }

      function keepNodeSelected(node) {
        const range = document.createRange();
        range.selectNodeContents(node);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        savedEditorRange = range.cloneRange();
      }

      function keepBlocksSelected(blocks) {
        const connectedBlocks = blocks.filter((block) => block?.isConnected && editor.contains(block));
        if (!connectedBlocks.length) return;
        const range = document.createRange();
        range.setStart(connectedBlocks[0], 0);
        range.setEnd(connectedBlocks.at(-1), connectedBlocks.at(-1).childNodes.length);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        savedEditorRange = range.cloneRange();
        lastToolbarBlocks = connectedBlocks;
        lastToolbarTarget = connectedBlocks.at(-1);
      }

      function blocksForRange(range) {
        const allBlocks = [...editor.children].filter((node) => node.matches('p, div, h1, h2, h3, h4'));
        const closestBlock = (node, offset, isEnd) => {
          if (node === editor) {
            const index = isEnd ? Math.max(0, offset - 1) : Math.min(offset, allBlocks.length - 1);
            return allBlocks[index];
          }
          if (node?.nodeType === Node.TEXT_NODE) node = node.parentElement;
          return node?.closest?.('p, div, h1, h2, h3, h4');
        };
        const startBlock = closestBlock(range.startContainer, range.startOffset, false);
        const endBlock = closestBlock(range.endContainer, range.endOffset, true);
        const startIndex = allBlocks.indexOf(startBlock);
        const endIndex = allBlocks.indexOf(endBlock);
        if (startIndex < 0 || endIndex < 0) return [];
        return allBlocks.slice(Math.min(startIndex, endIndex), Math.max(startIndex, endIndex) + 1);
      }

      function targetBlocks() {
        const allBlocks = [...editor.children].filter((node) => node.matches('p, div, h1, h2, h3, h4'));
        const selection = window.getSelection();
        if (selection.rangeCount && !selection.isCollapsed && editor.contains(selection.anchorNode)) {
          const range = selection.getRangeAt(0);
          const selected = blocksForRange(range);
          if (selected.length) return selected;
        }

        const remembered = lastToolbarBlocks.filter((block) => block?.isConnected && editor.contains(block));
        if (remembered.length) return remembered;

        let node = selection.anchorNode;
        if (node?.nodeType === Node.TEXT_NODE) node = node.parentElement;
        const block = node?.closest?.('p, div, h1, h2, h3, h4');
        return block && editor.contains(block) ? [block] : [];
      }

      function updateHistoryButtons() {
        undoButton.disabled = undoStack.length === 0;
        redoButton.disabled = redoStack.length === 0;
        undoButton.title = `撤销（可用 ${undoStack.length}/10 步）`;
        redoButton.title = `重做（可用 ${redoStack.length}/10 步）`;
      }

      function sanitizedEditorClone() {
        const clone = editor.cloneNode(true);
        clone.removeAttribute('id');
        clone.removeAttribute('contenteditable');
        clone.removeAttribute('aria-label');
        clone.querySelectorAll('[data-guidance-marker]').forEach((node) => node.remove());
        clone.querySelectorAll('[data-image-selected]').forEach((node) => node.removeAttribute('data-image-selected'));
        clone.querySelectorAll('[data-format-warning]').forEach((node) => node.removeAttribute('data-format-warning'));
        return clone;
      }

      function sanitizedEditorHtml() {
        return sanitizedEditorClone().innerHTML.trim();
      }

      function resetEditorHistory() {
        window.clearTimeout(historyTimer);
        undoStack = [];
        redoStack = [];
        lastHistoryHtml = sanitizedEditorHtml();
        updateHistoryButtons();
      }

      function commitEditorHistory() {
        window.clearTimeout(historyTimer);
        const currentHtml = sanitizedEditorHtml();
        if (!lastHistoryHtml) {
          lastHistoryHtml = currentHtml;
          updateHistoryButtons();
          return;
        }
        if (currentHtml === lastHistoryHtml) return;
        undoStack.push(lastHistoryHtml);
        if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
        redoStack = [];
        lastHistoryHtml = currentHtml;
        updateHistoryButtons();
      }

      function scheduleEditorHistory() {
        window.clearTimeout(historyTimer);
        historyTimer = window.setTimeout(commitEditorHistory, 180);
      }

      function applyHistorySnapshot(html) {
        window.getSelection()?.removeAllRanges();
        savedEditorRange = null;
        lastToolbarTarget = null;
        lastToolbarBlocks = [];
        editor.innerHTML = html;
        lastHistoryHtml = html;
        updateOutput();
        scheduleValidation();
        updateHistoryButtons();
      }

      function undoEditorChange() {
        commitEditorHistory();
        if (!undoStack.length) return;
        const currentHtml = sanitizedEditorHtml();
        const previousHtml = undoStack.pop();
        redoStack.push(currentHtml);
        if (redoStack.length > HISTORY_LIMIT) redoStack.shift();
        applyHistorySnapshot(previousHtml);
      }

      function redoEditorChange() {
        commitEditorHistory();
        if (!redoStack.length) return;
        const currentHtml = sanitizedEditorHtml();
        const nextHtml = redoStack.pop();
        undoStack.push(currentHtml);
        if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
        applyHistorySnapshot(nextHtml);
      }

      function rememberOriginalArticle(force = false) {
        if (hasUserOriginal && !force) return;
        originalArticleHtml = sanitizedEditorHtml();
        hasUserOriginal = true;
        resetEditorHistory();
      }

      function restoreOriginalArticle() {
        if (!originalArticleHtml) return;
        window.getSelection()?.removeAllRanges();
        savedEditorRange = null;
        lastToolbarTarget = null;
        lastToolbarBlocks = [];
        editor.innerHTML = originalArticleHtml;
        updateOutput();
        renderChecks(null);
        resetEditorHistory();
      }

      function guidanceSampleWasDismissed() {
        try { return localStorage.getItem(SAMPLE_DISMISSED_STORAGE_KEY) === '1'; }
        catch { return false; }
      }

      function dismissGuidanceSample() {
        if (!guidanceSampleActive) return;
        guidanceSampleActive = false;
        guidanceSampleBaselineHtml = '';
        editor.querySelectorAll('[data-guidance-marker]').forEach((node) => node.remove());
        try { localStorage.setItem(SAMPLE_DISMISSED_STORAGE_KEY, '1'); } catch {}
        if (!hasUserOriginal) originalArticleHtml = '';
      }

      function initializeBlankEditor() {
        savedEditorRange = null;
        lastToolbarTarget = null;
        lastToolbarBlocks = [];
        window.getSelection()?.removeAllRanges();
        editor.innerHTML = '';
        originalArticleHtml = '';
        hasUserOriginal = false;
        guidanceSampleActive = false;
        guidanceSampleBaselineHtml = '';
        updateOutput();
        renderChecks(null);
        resetEditorHistory();
      }

      function restoreSample() {
        if (guidanceSampleWasDismissed()) {
          initializeBlankEditor();
          return;
        }
        savedEditorRange = null;
        lastToolbarTarget = null;
        lastToolbarBlocks = [];
        window.getSelection()?.removeAllRanges();
        editor.innerHTML = sampleTemplate.innerHTML.trim();
        formatAll();
        originalArticleHtml = sanitizedEditorHtml();
        hasUserOriginal = false;
        guidanceSampleActive = true;
        guidanceSampleBaselineHtml = originalArticleHtml;
        const guide = sampleGuideTemplate.content.firstElementChild.cloneNode(true);
        guide.querySelector('[data-clear-guidance-sample]').addEventListener('click', () => {
          dismissGuidanceSample();
          initializeBlankEditor();
          editor.focus();
        });
        editor.prepend(guide);
        updateOutput();
        renderChecks(null);
        resetEditorHistory();
      }

      function convertMarkdownEmphasis(root) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);

        nodes.forEach((node) => {
          if (!node.nodeValue.includes('**')) return;
          const parts = node.nodeValue.split(/(\*\*[^*]+\*\*)/g);
          if (parts.length === 1) return;
          const fragment = document.createDocumentFragment();
          parts.forEach((part) => {
            if (/^\*\*[^*]+\*\*$/.test(part)) {
              const strong = document.createElement('strong');
              strong.textContent = part.slice(2, -2);
              fragment.appendChild(strong);
            } else if (part) {
              fragment.appendChild(document.createTextNode(part));
            }
          });
          node.replaceWith(fragment);
        });
      }

      const pastedBlockSelector = 'p, div, h1, h2, h3, h4, h5, h6, blockquote, pre, ul, ol, figure, section, article';

      function nodeHasPastedContent(node) {
        if (node.textContent.trim()) return true;
        if (node.nodeType !== Node.ELEMENT_NODE) return false;
        return node.matches('img, video, audio, iframe') || Boolean(node.querySelector('img, video, audio, iframe'));
      }

      function appendInlineGroup(fragment, nodes) {
        const paragraph = document.createElement('p');
        paragraph.append(...nodes);
        if (paragraph.textContent.trim() || paragraph.querySelector('img, video, audio, iframe')) fragment.appendChild(paragraph);
      }

      function unwrapTopLevelContainer(container) {
        const fragment = document.createDocumentFragment();
        let inlineNodes = [];
        const flushInlineNodes = () => {
          if (!inlineNodes.length) return;
          appendInlineGroup(fragment, inlineNodes);
          inlineNodes = [];
        };

        [...container.childNodes].forEach((child) => {
          if (child.nodeType === Node.ELEMENT_NODE && child.matches(pastedBlockSelector)) {
            flushInlineNodes();
            fragment.appendChild(child);
            return;
          }
          if (child.nodeType === Node.TEXT_NODE && !child.textContent.trim()) return;
          inlineNodes.push(child);
        });
        flushInlineNodes();
        container.replaceWith(fragment);
      }

      function splitInlineNodesAtBreaks(nodes) {
        const groups = [[]];
        nodes.forEach((node) => {
          if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'BR') {
            groups.push([]);
            return;
          }
          if (node.nodeType !== Node.ELEMENT_NODE || !node.childNodes.length) {
            groups.at(-1).push(node.cloneNode(true));
            return;
          }

          const nestedGroups = splitInlineNodesAtBreaks([...node.childNodes]);
          nestedGroups.forEach((nestedGroup, index) => {
            if (index > 0) groups.push([]);
            const clone = node.cloneNode(false);
            clone.append(...nestedGroup);
            if (clone.textContent.trim() || clone.querySelector('img, video, audio, iframe') || !node.childNodes.length) {
              groups.at(-1).push(clone);
            }
          });
        });
        return groups;
      }

      function splitTopLevelBreakBlock(block) {
        if (!block.querySelector('br') || block.dataset.wechatRole || /^H[1-6]$/.test(block.tagName)) return false;
        const groups = splitInlineNodesAtBreaks([...block.childNodes])
          .filter((group) => group.some(nodeHasPastedContent));
        if (groups.length < 2) return false;
        const fragment = document.createDocumentFragment();
        groups.forEach((group) => appendInlineGroup(fragment, group));
        block.replaceWith(fragment);
        return true;
      }

      function normalizeTopLevelBlocks() {
        [...editor.childNodes].forEach((node) => {
          if (node.nodeType !== Node.TEXT_NODE || !node.textContent.trim()) return;
          const lines = node.textContent.replace(/\r\n?/g, '\n').split(/\n+/).map((line) => line.trim()).filter(Boolean);
          const fragment = document.createDocumentFragment();
          (lines.length ? lines : [node.textContent]).forEach((line) => {
            const paragraph = document.createElement('p');
            paragraph.textContent = line;
            fragment.appendChild(paragraph);
          });
          node.replaceWith(fragment);
        });

        let nestedContainersRemain = true;
        let safetyCounter = 0;
        while (nestedContainersRemain && safetyCounter < 12) {
          nestedContainersRemain = false;
          safetyCounter += 1;
          [...editor.children].forEach((container) => {
            if (!container.matches('div, section, article')) return;
            const hasDirectBlocks = [...container.children].some((child) => child.matches(pastedBlockSelector));
            if (!hasDirectBlocks) return;
            unwrapTopLevelContainer(container);
            nestedContainersRemain = true;
          });
        }

        [...editor.children].forEach((block) => splitTopLevelBreakBlock(block));

        [...editor.children].forEach((block) => {
          if (!block.matches('div, section, article')) return;
          const paragraph = document.createElement('p');
          paragraph.append(...block.childNodes);
          [...block.attributes].forEach((attribute) => paragraph.setAttribute(attribute.name, attribute.value));
          block.replaceWith(paragraph);
        });

        normalizeEditorImages();
      }

      function normalizeEditorImages() {
        [...editor.querySelectorAll('img')].forEach((image) => {
          if (image.closest('[data-guidance-marker]')) return;
          image.setAttribute('style', imageElementStyle());
          image.setAttribute('draggable', 'false');
          if (!image.getAttribute('alt')) image.setAttribute('alt', '文章图片');
          image.setAttribute('aria-label', '文章图片，按 Ctrl 或 Command + C 复制');

          let topLevel = image;
          while (topLevel.parentElement && topLevel.parentElement !== editor) topLevel = topLevel.parentElement;
          if (topLevel.parentElement !== editor) return;
          if (topLevel === image) {
            const paragraph = document.createElement('p');
            paragraph.dataset.wechatRole = 'image';
            paragraph.setAttribute('style', imageBlockStyle());
            image.replaceWith(paragraph);
            paragraph.appendChild(image);
            return;
          }
          if (!topLevel.textContent.trim()) {
            topLevel.dataset.wechatRole = 'image';
            topLevel.setAttribute('style', imageBlockStyle());
          } else {
            image.style.display = 'block';
          }
        });
      }

      function currentImageInsertionAnchor() {
        const selection = window.getSelection();
        let node = selection?.anchorNode;
        if (node?.nodeType === Node.TEXT_NODE) node = node.parentElement;
        const selectedBlock = node?.closest?.('p, div, h1, h2, h3, h4, figure');
        if (selectedBlock && selectedBlock.parentElement === editor) return selectedBlock;
        const remembered = lastToolbarTarget?.isConnected && editor.contains(lastToolbarTarget) ? lastToolbarTarget : null;
        return remembered?.parentElement === editor ? remembered : editor.lastElementChild;
      }

      function insertCenteredImage(source, alt = '文章图片', afterBlock = currentImageInsertionAnchor()) {
        const paragraph = document.createElement('p');
        paragraph.dataset.wechatRole = 'image';
        paragraph.setAttribute('style', imageBlockStyle());
        const image = document.createElement('img');
        image.src = source;
        image.alt = alt || '文章图片';
        image.setAttribute('aria-label', '文章图片，按 Ctrl 或 Command + C 复制');
        image.setAttribute('style', imageElementStyle());
        image.setAttribute('draggable', 'false');
        paragraph.appendChild(image);

        if (afterBlock?.parentElement === editor) afterBlock.insertAdjacentElement('afterend', paragraph);
        else editor.appendChild(paragraph);

        editor.querySelectorAll('img[data-image-selected]').forEach((node) => node.removeAttribute('data-image-selected'));
        image.dataset.imageSelected = 'true';
        const range = document.createRange();
        range.setStartAfter(paragraph);
        range.collapse(true);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        savedEditorRange = range.cloneRange();
        return paragraph;
      }

      function fileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ''));
          reader.onerror = () => reject(reader.error || new Error('图片读取失败'));
          reader.readAsDataURL(file);
        });
      }

      async function insertImageFiles(files) {
        const images = [...files].filter((file) => file?.type?.startsWith('image/'));
        if (!images.length) return 0;
        dismissGuidanceSample();
        let anchor = currentImageInsertionAnchor();
        for (const [index, file] of images.entries()) {
          const source = await fileAsDataUrl(file);
          anchor = insertCenteredImage(source, file.name || `粘贴图片 ${index + 1}`, anchor);
        }
        rememberOriginalArticle(false);
        updateOutput();
        scheduleValidation();
        scheduleEditorHistory();
        return images.length;
      }

      function selectedEditorImage() {
        return editor.querySelector('img[data-image-selected="true"]');
      }

      function copyImageElementFallback(image) {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNode(image);
        selection.removeAllRanges();
        selection.addRange(range);
        const copied = document.execCommand('copy');
        selection.removeAllRanges();
        return copied;
      }

      async function imageBlobAsPng(blob) {
        if (blob.type === 'image/png') return blob;
        const objectUrl = URL.createObjectURL(blob);
        try {
          const image = new Image();
          image.src = objectUrl;
          await image.decode();
          const canvas = document.createElement('canvas');
          canvas.width = image.naturalWidth;
          canvas.height = image.naturalHeight;
          canvas.getContext('2d').drawImage(image, 0, 0);
          return await new Promise((resolve, reject) => canvas.toBlob((value) => value ? resolve(value) : reject(new Error('图片转换失败')), 'image/png'));
        } finally {
          URL.revokeObjectURL(objectUrl);
        }
      }

      async function copySelectedImage() {
        const image = selectedEditorImage();
        if (!image) return false;
        let copied = false;
        try {
          const sourceBlob = await (await fetch(image.src)).blob();
          const pngBlob = await imageBlobAsPng(sourceBlob);
          if (!navigator.clipboard?.write || typeof ClipboardItem === 'undefined') throw new Error('剪贴板不支持');
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
          copied = true;
        } catch {
          copied = copyImageElementFallback(image);
        }
        if (copied) {
          image.setAttribute('aria-label', '图片已复制');
          window.setTimeout(() => image.setAttribute('aria-label', '文章图片，按 Ctrl 或 Command + C 复制'), 1800);
        }
        return copied;
      }

      function isTitleBlock(block) {
        if (block.dataset.wechatRole === 'article-title') return false;
        const tagIsHeading = /^H[1-4]$/.test(block.tagName);
        const explicitRole = block.dataset.wechatRole === 'chapter-title';
        const text = block.textContent.trim();
        const semanticCandidate = isLikelyBasicTitle(text);
        return tagIsHeading || explicitRole || semanticCandidate;
      }

      function isLikelyBasicTitle(text) {
        const normalized = String(text || '').replace(/\s+/g, ' ').trim();
        if (!normalized || normalized.length > 60) return false;
        if (/[。！？!?；;]/.test(normalized)) return false;
        if (basicNumberedTitlePattern.test(normalized)) return true;
        if (normalized.length < 2 || normalized.length > 24) return false;
        if (/[，,.。！？!?；;：:、“”‘’"'（）()\[\]【】《》〈〉<>—–…·%％+＋\-/\\|]/.test(normalized)) return false;
        if (/^(?:摘要|导语|编者按|前言|作者|撰文|来源|日期|时间|正文)$/.test(normalized)) return false;
        if (/^[\d\s.%+-]+$/.test(normalized)) return false;
        return /[A-Za-z\u3400-\u9fff]/.test(normalized);
      }

      function isLikelyArticleTitle(text) {
        const normalized = String(text || '').replace(/\s+/g, ' ').trim();
        if (normalized.length < 2 || normalized.length > 50) return false;
        if (articleMetadataPattern.test(normalized) || basicNumberedTitlePattern.test(normalized)) return false;
        if (/^(?:摘要|导语|编者按|前言|正文)$/.test(normalized)) return false;
        if (/[。；;]/.test(normalized)) return false;
        if ((normalized.match(/[，,]/g) || []).length > 2) return false;
        return /[A-Za-z\u3400-\u9fff]/.test(normalized);
      }

      function detectLeadingArticleTitle() {
        const existing = [...editor.children].find((block) => block.dataset.wechatRole === 'article-title');
        if (existing) {
          existing.setAttribute('style', articleTitleStyle(existing.style.fontFamily || selectedFontStack));
          return existing;
        }

        let candidate = null;
        for (const block of [...editor.children]) {
          if (block.hasAttribute('data-guidance-marker') || block.dataset.wechatRole === 'image' || block.querySelector('img')) continue;
          const rawText = block.textContent.replace(/\s+/g, ' ').trim();
          if (!rawText) continue;
          if (articleMetadataPattern.test(rawText)) continue;

          const rawOriginalText = block.dataset.titleOriginal?.trim() || rawText;
          const originalLines = rawOriginalText.split(/\r?\n+/).map((line) => line.trim()).filter(Boolean);
          const originalHasDetachedNumber = originalLines.length >= 2 && standaloneTitleNumberPattern.test(originalLines[0]);
          const originalText = rawOriginalText.replace(/\s+/g, ' ').trim();
          if (originalHasDetachedNumber || basicNumberedTitlePattern.test(originalText)) return null;
          const candidateText = block.dataset.titleBase?.trim() || titleBaseFromBlock(block) || rawText;
          if (!/^H[1-4]$/.test(block.tagName) && !isLikelyArticleTitle(candidateText)) return null;
          candidate = block;
          break;
        }
        if (!candidate) return null;

        let articleTitle = candidate;
        if (articleTitle.tagName !== 'P') {
          const paragraph = document.createElement('p');
          paragraph.append(...articleTitle.childNodes);
          articleTitle.replaceWith(paragraph);
          articleTitle = paragraph;
        }
        const titleText = articleTitle.dataset.titleBase?.trim() || titleBaseFromBlock(articleTitle) || articleTitle.textContent.trim();
        articleTitle.replaceChildren(document.createTextNode(titleText));
        articleTitle.dataset.wechatRole = 'article-title';
        articleTitle.removeAttribute('data-title-original');
        articleTitle.removeAttribute('data-title-base');
        articleTitle.setAttribute('style', articleTitleStyle(articleTitle.style.fontFamily || selectedFontStack));
        return articleTitle;
      }

      function basicIdentifyStructure(feedbackButton = basicIdentifyButton) {
        dismissGuidanceSample();
        rememberOriginalArticle(false);
        convertMarkdownEmphasis(editor);
        normalizeTopLevelBlocks();
        removeDetachedTitleNumberBlocks();
        detectLeadingArticleTitle();

        const counts = { articleTitle: 0, author: 0, title: 0, body: 0, image: 0 };
        [...editor.children].forEach((sourceBlock) => {
          if (sourceBlock.hasAttribute('data-guidance-marker')) return;
          let block = sourceBlock;
          if (block.tagName !== 'P') {
            const paragraph = document.createElement('p');
            paragraph.append(...block.childNodes);
            block.replaceWith(paragraph);
            block = paragraph;
          }

          const text = block.textContent.replace(/\s+/g, ' ').trim();
          block.removeAttribute('data-quote-previous-role');
          block.removeAttribute('data-title-original');
          block.removeAttribute('data-title-base');

          if (block.dataset.wechatRole === 'article-title') {
            block.setAttribute('style', articleTitleStyle(block.style.fontFamily || selectedFontStack));
            counts.articleTitle += 1;
            return;
          }

          if (block.querySelector('img') && !text) {
            block.dataset.wechatRole = 'image';
            block.setAttribute('style', imageBlockStyle());
            normalizeEditorImages();
            counts.image += 1;
            return;
          }

          if (basicAuthorPattern.test(text)) {
            block.dataset.wechatRole = 'author';
            block.setAttribute('style', authorStyle());
            counts.author += 1;
            return;
          }

          if (isLikelyBasicTitle(text)) {
            block.dataset.wechatRole = 'chapter-title';
            block.dataset.titleOriginal = text;
            block.dataset.titleBase = titleBaseFromBlock(block);
            block.setAttribute('style', titleStyle());
            block.textContent = '';
            const span = document.createElement('span');
            span.setAttribute('style', `font-size:${currentTitleSize}px;line-height:1.35;color:${currentTitleColor};font-weight:700;font-family:${selectedFontStack};`);
            span.textContent = text;
            block.appendChild(span);
            counts.title += 1;
            return;
          }

          block.dataset.wechatRole = 'body';
          block.setAttribute('style', bodyStyle(block.style.fontFamily || selectedFontStack));
          counts.body += 1;
        });

        applyTitleNumbering(currentTitleNumberStyle, false);
        syncThemeColor();
        updateOutput();
        validateFormat();
        const originalTooltip = '识别作者、带序号或无标点短标题与正文';
        const resultText = `已识别：全文标题 ${counts.articleTitle} · 作者 ${counts.author} · 章节标题 ${counts.title} · 正文 ${counts.body}`;
        feedbackButton?.setAttribute('data-tooltip', resultText);
        const originalLabel = feedbackButton?.textContent;
        if (feedbackButton?.matches('[data-mobile-action]')) feedbackButton.textContent = `标题 ${counts.title}`;
        window.setTimeout(() => {
          feedbackButton?.setAttribute('data-tooltip', originalTooltip);
          if (feedbackButton?.matches('[data-mobile-action]')) feedbackButton.textContent = originalLabel;
        }, 2600);
        return counts;
      }

      function stripTitleNumber(text) {
        return text
          .replace(/^第[一二三四五六七八九十百零\d]+(?:章|节|部分|篇|讲|单元)\s*/, '')
          .replace(/^[（(](?:[一二三四五六七八九十百零]+|\d{1,3})[）)]\s*/, '')
          .replace(/^[一二三四五六七八九十百零\d]+[\.\uff0e、]\s*/, '')
          .replace(/^[一二三四五六七八九十百零\d]+\s+(?=\S)/, '')
          .trim();
      }

      function titleBaseFromBlock(block) {
        const storedBase = block?.dataset?.titleBase?.trim();
        if (storedBase) return storedBase;

        const explicitTitlePart = block?.querySelector?.('[data-wechat-title-part="box"], [data-wechat-title-part="title"]');
        const explicitText = explicitTitlePart?.textContent?.replace(/\s+/g, ' ').trim();
        if (explicitText) return stripTitleNumber(explicitText) || explicitText;

        const directParts = [...(block?.children || [])]
          .map((child) => child.textContent.replace(/\s+/g, ' ').trim())
          .filter(Boolean);
        if (directParts.length >= 2 && standaloneTitleNumberPattern.test(directParts[0])) {
          const candidate = directParts.slice(1).join(' ').trim();
          if (candidate) return stripTitleNumber(candidate) || candidate;
        }

        const renderedLines = String(block?.innerText || '')
          .replace(/\r\n?/g, '\n')
          .split(/\n+/)
          .map((line) => line.trim())
          .filter(Boolean);
        if (renderedLines.length >= 2 && standaloneTitleNumberPattern.test(renderedLines[0])) {
          const candidate = renderedLines.slice(1).join(' ').trim();
          if (candidate) return stripTitleNumber(candidate) || candidate;
        }

        const text = block?.textContent?.replace(/\s+/g, ' ').trim() || '';
        return stripTitleNumber(text) || text;
      }

      function removeDetachedTitleNumberBlocks() {
        const blocks = [...editor.children];
        blocks.forEach((block, index) => {
          const marker = block.textContent.replace(/\s+/g, ' ').trim();
          if (!standaloneTitleNumberPattern.test(marker)) return;
          const nextBlock = blocks.slice(index + 1).find((candidate) => candidate.isConnected && candidate.textContent.trim());
          if (!nextBlock) return;
          const nextText = nextBlock.textContent.replace(/\s+/g, ' ').trim();
          if (nextBlock.dataset.wechatRole !== 'chapter-title' && !isLikelyBasicTitle(nextText)) return;
          nextBlock.dataset.titleOriginal ||= `${marker}\n${nextText}`;
          nextBlock.dataset.titleBase ||= titleBaseFromBlock(nextBlock);
          block.remove();
        });
      }

      function chineseNumber(index) {
        const digits = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
        if (index <= 10) return digits[index];
        if (index < 20) return `十${digits[index - 10]}`;
        if (index < 100) return `${digits[Math.floor(index / 10)]}十${digits[index % 10]}`;
        return String(index);
      }

      function ensureChapterTitleBlocks() {
        removeDetachedTitleNumberBlocks();
        detectLeadingArticleTitle();
        const promoted = [];
        [...editor.children].forEach((sourceBlock) => {
          if (!isTitleBlock(sourceBlock)) return;
          let block = sourceBlock;
          if (block.tagName !== 'P') {
            const paragraph = document.createElement('p');
            paragraph.append(...block.childNodes);
            block.replaceWith(paragraph);
            block = paragraph;
          }
          const text = block.textContent.trim();
          block.dataset.wechatRole = 'chapter-title';
          block.dataset.titleOriginal ||= text;
          block.dataset.titleBase ||= titleBaseFromBlock(block);
          block.setAttribute('style', titleStyle(block.style.fontFamily || selectedFontStack));
          promoted.push(block);
        });
        return promoted;
      }

      function applyTitleNumbering(style = currentTitleNumberStyle, shouldUpdate = true) {
        ensureChapterTitleBlocks();
        const titles = [...editor.children].filter((block) => block.dataset.wechatRole === 'chapter-title');
        titles.forEach((block, index) => {
          const currentText = block.textContent.trim();
          if (!block.dataset.titleOriginal) {
            block.dataset.titleOriginal = currentText;
            block.dataset.titleBase = titleBaseFromBlock(block);
          }
          const base = block.dataset.titleBase || titleBaseFromBlock(block);
          if (style === 'chinese-line' || style === 'chinese-box') {
            const numberLine = document.createElement('span');
            numberLine.dataset.wechatTitlePart = 'number';
            numberLine.setAttribute(
              'style',
              `display:block;margin:0 0 ${style === 'chinese-box' ? 6 : 0}px;padding:0;` +
              `font-size:${currentTitleSize}px;line-height:1.35;letter-spacing:2px;` +
              `color:${currentTitleColor};font-weight:700;font-family:${selectedFontStack};`
            );
            numberLine.textContent = chineseNumber(index + 1);
            const titleLine = document.createElement('span');
            if (style === 'chinese-box') {
              titleLine.dataset.wechatTitlePart = 'box';
              titleLine.setAttribute(
                'style',
                `display:inline;width:auto;margin:0;padding:2px 6px;box-sizing:border-box;` +
                `box-decoration-break:clone;-webkit-box-decoration-break:clone;` +
                `font-size:${currentTitleSize}px;line-height:1.35;letter-spacing:2px;` +
                `background-color:${currentTitleColor};color:#ffffff;font-weight:700;font-family:${selectedFontStack};`
              );
            } else {
              titleLine.dataset.wechatTitlePart = 'title';
              titleLine.setAttribute(
                'style',
                `display:block;margin:0;padding:0;font-size:${currentTitleSize}px;line-height:1.35;` +
                `color:${currentTitleColor};font-weight:700;font-family:${selectedFontStack};`
              );
            }
            titleLine.textContent = base;
            block.replaceChildren(numberLine, titleLine);
          } else {
            const nextText = style === 'chinese'
              ? `${chineseNumber(index + 1)}、${base}`
              : style === 'none'
                ? base
                : `${index + 1}. ${base}`;
            block.textContent = nextText;
          }
          block.setAttribute('style', titleStyle(block.style.fontFamily || selectedFontStack));
        });
        currentTitleNumberStyle = ['arabic', 'chinese', 'chinese-line', 'chinese-box', 'none'].includes(style) ? style : 'arabic';
        currentTitleNumberLabel.textContent = TITLE_NUMBER_LABELS[currentTitleNumberStyle];
        if (shouldUpdate) updateOutput();
      }

      function formatAll() {
        dismissGuidanceSample();
        convertMarkdownEmphasis(editor);
        normalizeTopLevelBlocks();
        removeDetachedTitleNumberBlocks();
        detectLeadingArticleTitle();

        const sourceBlocks = [...editor.children];
        const firstTitleIndex = sourceBlocks.findIndex(isTitleBlock);
        const firstContentIndex = sourceBlocks.findIndex((block) => !basicAuthorPattern.test(block.textContent.trim()));
        sourceBlocks.forEach((sourceBlock, index) => {
          const text = sourceBlock.textContent.trim();
          if (sourceBlock.querySelector('img') && !text) {
            sourceBlock.dataset.wechatRole = 'image';
            sourceBlock.setAttribute('style', imageBlockStyle());
          } else if (sourceBlock.dataset.wechatRole === 'article-title') {
            sourceBlock.setAttribute('style', articleTitleStyle(sourceBlock.style.fontFamily || selectedFontStack));
          } else if (sourceBlock.dataset.wechatRole === 'quote') {
            sourceBlock.setAttribute('style', quoteStyle());
          } else if (isTitleBlock(sourceBlock)) {
            const paragraph = document.createElement('p');
            paragraph.dataset.wechatRole = 'chapter-title';
            paragraph.dataset.titleOriginal = sourceBlock.dataset.titleOriginal || text;
            paragraph.dataset.titleBase = sourceBlock.dataset.titleBase || titleBaseFromBlock(sourceBlock);
            paragraph.setAttribute('style', titleStyle());
            const span = document.createElement('span');
            span.setAttribute('style', `font-size:${currentTitleSize}px;line-height:1.35;color:${currentTitleColor};font-weight:700;font-family:${selectedFontStack};`);
            span.textContent = text;
            paragraph.appendChild(span);
            sourceBlock.replaceWith(paragraph);
          } else if (basicAuthorPattern.test(text)) {
            sourceBlock.dataset.wechatRole = 'author';
            sourceBlock.setAttribute('style', authorStyle());
          } else if ((firstTitleIndex > 0 && index < firstTitleIndex) || (firstTitleIndex < 0 && index === firstContentIndex)) {
            sourceBlock.dataset.wechatRole = 'intro';
            sourceBlock.setAttribute('style', introStyle());
          } else {
            sourceBlock.dataset.wechatRole = 'body';
            sourceBlock.setAttribute('style', bodyStyle());
          }
        });

        normalizeEditorImages();

        editor.querySelectorAll('font').forEach((element) => {
          element.removeAttribute('face');
          element.removeAttribute('size');
        });
        editor.querySelectorAll('span, font, em, i').forEach((element) => {
          if (element.closest('[data-wechat-role="chapter-title"]')) return;
          if (element.closest('strong, b, mark, [data-wechat-role="emphasis"], [data-wechat-role="emphasis-blue"], [data-wechat-role="emphasis-color"]')) return;
          element.style.removeProperty('font-size');
          element.style.removeProperty('font-family');
        });
        editor.querySelectorAll('strong, b, mark, [data-wechat-role="emphasis"], [data-wechat-role="emphasis-blue"], [data-wechat-role="emphasis-color"]').forEach((element) => {
          if (element.closest('[data-wechat-role="chapter-title"]')) return;
          const keepItalic = getComputedStyle(element).fontStyle === 'italic';
          element.dataset.wechatRole = 'emphasis';
          element.setAttribute('style', emphasisStyle(selectedFontStack));
          if (keepItalic) element.style.fontStyle = 'italic';
          element.querySelectorAll('span, font, em, i, strong, b, mark').forEach((child) => {
            child.removeAttribute('face');
            child.removeAttribute('size');
            child.style.fontSize = `${currentBodySize}px`;
            child.style.fontFamily = selectedFontStack;
            child.style.color = currentAccentColor;
            child.style.fontWeight = '700';
          });
        });

        applyTitleNumbering(currentTitleNumberStyle, false);
        syncThemeColor();
        validateFormat();
      }

      function applyBlockRole(role, size) {
        if (role === 'heading') {
          currentTitleSize = Number(size) || currentTitleSize;
          currentTitleSizeLabel.textContent = `${currentTitleSize}`;
        } else {
          currentBodySize = Number(size) || currentBodySize;
          currentBodySizeLabel.textContent = `${currentBodySize}`;
        }

        const selection = window.getSelection();
        const hasExplicitSelection = selection.rangeCount && !selection.isCollapsed && editor.contains(selection.anchorNode) && editor.contains(selection.focusNode);
        if (!hasExplicitSelection) {
          formatAll();
          return;
        }

        const blocks = targetBlocks();
        if (!blocks.length) return;

        const normalizedBlocks = blocks.map((sourceBlock) => {
          const previousRole = sourceBlock.dataset.wechatRole;
          let block = sourceBlock;
          if (block.tagName !== 'P') {
            const paragraph = document.createElement('p');
            paragraph.append(...block.childNodes);
            block.replaceWith(paragraph);
            block = paragraph;
          }

          block.querySelectorAll('strong, b, mark, [data-wechat-role="emphasis"], [data-wechat-role="emphasis-blue"]').forEach((element) => {
            element.replaceWith(...element.childNodes);
          });

          if (previousRole === 'chapter-title') {
            block.querySelectorAll(':scope > span').forEach((span) => {
              if (pxValue(span.style.fontSize) >= 20) span.replaceWith(...span.childNodes);
            });
          }

          if (role === 'heading') {
            block.dataset.wechatRole = 'chapter-title';
            block.setAttribute('style', titleStyle(block.style.fontFamily || selectedFontStack, currentTitleSize));
          } else {
            block.dataset.wechatRole = 'body';
            block.setAttribute('style', bodyStyle(block.style.fontFamily || selectedFontStack, currentBodySize));
          }
          block.normalize();
          return block;
        });

        if (role === 'heading') applyTitleNumbering(currentTitleNumberStyle, false);
        keepBlocksSelected(normalizedBlocks);
        updateOutput();
      }

      function applySelectedFont(fontKey) {
        selectedFontKey = FONT_STACKS[fontKey] ? fontKey : selectedFontKey;
        selectedFontStack = FONT_STACKS[selectedFontKey] || FONT_STACKS.system;
        restoreEditorSelection();
        const selection = window.getSelection();
        if (!selection.rangeCount || selection.isCollapsed || !editor.contains(selection.anchorNode)) return;
        document.execCommand('styleWithCSS', false, true);
        document.execCommand('fontName', false, selectedFontStack);
        updateOutput();
      }

      function applyParagraphIndent(value) {
        const nextIndent = [8, 16].includes(Number(value)) ? Number(value) : 8;
        currentIndent = nextIndent;
        currentIndentLabel.textContent = String(currentIndent);
        restoreEditorSelection();
        let blocks = targetBlocks();
        if (!blocks.length) blocks = [...editor.children].filter((node) => node.matches('p, div, h1, h2, h3, h4'));
        blocks.forEach((block) => {
          block.style.marginLeft = `${currentIndent}px`;
          block.style.marginRight = `${currentIndent}px`;
        });
        if (blocks.length) keepBlocksSelected(blocks);
        updateOutput();
        scheduleValidation();
      }

      function applyQuote() {
        const blocks = targetBlocks();
        if (!blocks.length) return;
        const isQuotedBlock = (block) => block.dataset.wechatRole === 'quote' || block.hasAttribute('data-quote-previous-role');
        const shouldRemoveQuote = blocks.every(isQuotedBlock);
        const quotedBlocks = blocks.map((sourceBlock) => {
          const sourceRole = sourceBlock.dataset.wechatRole || (isTitleBlock(sourceBlock) ? 'chapter-title' : 'body');
          let block = sourceBlock;
          if (block.tagName !== 'P') {
            const paragraph = document.createElement('p');
            paragraph.append(...block.childNodes);
            block.replaceWith(paragraph);
            block = paragraph;
          }

          const fontFamily = block.style.fontFamily || selectedFontStack;
          if (shouldRemoveQuote) {
            const previousRole = block.dataset.quotePreviousRole || 'body';
            delete block.dataset.quotePreviousRole;
            block.dataset.wechatRole = previousRole;
            if (previousRole === 'chapter-title') block.setAttribute('style', titleStyle(fontFamily));
            else if (previousRole === 'article-title') block.setAttribute('style', articleTitleStyle(fontFamily));
            else if (previousRole === 'intro') block.setAttribute('style', introStyle(fontFamily));
            else if (previousRole === 'author') block.setAttribute('style', authorStyle(fontFamily));
            else block.setAttribute('style', bodyStyle(fontFamily));
          } else {
            if (block.dataset.wechatRole !== 'quote') {
              block.dataset.quotePreviousRole = sourceRole;
            }
            block.dataset.wechatRole = 'quote';
            block.setAttribute('style', quoteStyle(fontFamily));
          }
          return block;
        });
        keepBlocksSelected(quotedBlocks);
        updateOutput();
      }

      function applyEmphasisRole(role) {
        const emphasisSelector = 'strong, b, mark, [data-wechat-role="emphasis"], [data-wechat-role="emphasis-blue"]';
        const blocks = targetBlocks();
        if (blocks.length > 1) {
          const fullBlockEmphasis = blocks.map((block) => {
            const meaningfulChildren = [...block.childNodes].filter((node) => node.nodeType !== Node.TEXT_NODE || node.textContent.trim());
            if (meaningfulChildren.length !== 1) return null;
            const candidate = meaningfulChildren[0];
            return candidate.nodeType === Node.ELEMENT_NODE && candidate.matches(emphasisSelector)
              ? candidate
              : null;
          });

          if (fullBlockEmphasis.every(Boolean)) {
            fullBlockEmphasis.forEach((element) => element.replaceWith(...element.childNodes));
            blocks.forEach((block) => block.normalize());
            keepBlocksSelected(blocks);
            updateOutput();
            return;
          }

          const normalizedBlocks = blocks.map((sourceBlock) => {
            let block = sourceBlock;
            if (block.tagName !== 'P') {
              const paragraph = document.createElement('p');
              paragraph.append(...block.childNodes);
              block.replaceWith(paragraph);
              block = paragraph;
            }
            block.querySelectorAll(':scope > span').forEach((span) => {
              if (pxValue(span.style.fontSize) >= 20) span.replaceWith(...span.childNodes);
            });
            block.querySelectorAll(emphasisSelector).forEach((element) => {
              element.replaceWith(...element.childNodes);
            });
            block.dataset.wechatRole = 'body';
            block.setAttribute('style', bodyStyle(block.style.fontFamily || selectedFontStack));
            block.normalize();
            const strong = document.createElement('strong');
            strong.dataset.wechatRole = role;
            strong.setAttribute('style', role === 'emphasis-blue' ? blueEmphasisStyle(block.style.fontFamily || selectedFontStack) : emphasisStyle(block.style.fontFamily || selectedFontStack));
            strong.append(...block.childNodes);
            block.appendChild(strong);
            return block;
          });
          keepBlocksSelected(normalizedBlocks);
          updateOutput();
          return;
        }

        const selection = window.getSelection();
        let range = selection.rangeCount && !selection.isCollapsed && editor.contains(selection.anchorNode)
          ? selection.getRangeAt(0)
          : null;
        let emphasis = lastToolbarTarget?.isConnected && lastToolbarTarget.matches?.(emphasisSelector)
          ? lastToolbarTarget
          : null;

        if (!range && !emphasis && lastToolbarTarget?.isConnected && editor.contains(lastToolbarTarget)) {
          keepNodeSelected(lastToolbarTarget);
          range = window.getSelection().getRangeAt(0);
        }

        let sourceNode = emphasis || range?.commonAncestorContainer || lastToolbarTarget;
        if (sourceNode?.nodeType === Node.TEXT_NODE) sourceNode = sourceNode.parentElement;
        const sourceBlock = sourceNode?.matches?.('p, div, h1, h2, h3, h4')
          ? sourceNode
          : sourceNode?.closest?.('p, div, h1, h2, h3, h4');
        if (sourceBlock?.dataset.wechatRole === 'chapter-title') {
          sourceBlock.querySelectorAll(':scope > span').forEach((span) => {
            if (pxValue(span.style.fontSize) >= 20) span.replaceWith(...span.childNodes);
          });
          sourceBlock.dataset.wechatRole = 'body';
          sourceBlock.setAttribute('style', bodyStyle());
          sourceBlock.normalize();
          lastToolbarTarget = sourceBlock;
          emphasis = null;
          keepNodeSelected(sourceBlock);
          range = window.getSelection().getRangeAt(0);
        }

        if (!emphasis && range) {
          const selectedText = range.toString().trim();
          const candidates = [...editor.querySelectorAll(emphasisSelector)]
            .filter((element) => {

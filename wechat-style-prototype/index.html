              try { return range.intersectsNode(element) && element.textContent.trim() === selectedText; } catch { return false; }
            })
            .sort((a, b) => a.textContent.length - b.textContent.length);
          emphasis = candidates[0];
        }

        if (emphasis) {
          const parent = emphasis.parentNode;
          const children = [...emphasis.childNodes];
          emphasis.replaceWith(...children);
          parent?.normalize();
          lastToolbarTarget = sourceBlock?.isConnected ? sourceBlock : parent;
          if (sourceBlock?.isConnected) keepNodeSelected(sourceBlock);
          updateOutput();
          return;
        }

        if (!range) return;
        if (!emphasis) {
          emphasis = document.createElement('strong');
          try {
            range.surroundContents(emphasis);
          } catch {
            emphasis.appendChild(range.extractContents());
            range.insertNode(emphasis);
          }
        }

        emphasis.dataset.wechatRole = role;
        emphasis.setAttribute('style', role === 'emphasis-blue' ? blueEmphasisStyle() : emphasisStyle());
        lastToolbarTarget = emphasis;
        keepNodeSelected(emphasis);
        updateOutput();
      }

      function applyEmphasis() {
        applyEmphasisRole('emphasis');
      }

      function applyBlueEmphasis() {
        applyEmphasisRole('emphasis-blue');
      }

      function applyTextColor(color) {
        setThemeColor(color);
        syncThemeColor();
        applyTitleNumbering(currentTitleNumberStyle, false);
        updateOutput();
      }

      function applyThemeBold() {
        applyEmphasis();
      }

      function clearFormatting() {
        const selection = window.getSelection();
        const affectedBlocks = targetBlocks();
        if (!affectedBlocks.length) return;

        if (selection.rangeCount && !selection.isCollapsed && editor.contains(selection.anchorNode)) {
          document.execCommand('removeFormat', false, null);
        }

        const normalizedBlocks = affectedBlocks.map((block) => {
          let normalizedBlock = block;
          if (block.tagName !== 'P') {
            normalizedBlock = document.createElement('p');
            normalizedBlock.append(...block.childNodes);
            block.replaceWith(normalizedBlock);
          }

          normalizedBlock.querySelectorAll('*').forEach((element) => {
            element.removeAttribute('style');
            element.removeAttribute('color');
            element.removeAttribute('size');
            element.removeAttribute('face');
            element.removeAttribute('data-wechat-role');
          });

          normalizedBlock.querySelectorAll('font, strong, b, mark, span').forEach((element) => {
            element.replaceWith(...element.childNodes);
          });
          normalizedBlock.normalize();
          normalizedBlock.dataset.wechatRole = 'body';
          normalizedBlock.setAttribute('style', bodyStyle());
          return normalizedBlock;
        });

        keepBlocksSelected(normalizedBlocks);
        updateOutput();
      }

      function pxValue(value) {
        const number = Number.parseFloat(value || '0');
        return Number.isFinite(number) ? number : 0;
      }

      function primaryFontName(value) {
        return String(value || '').split(',')[0].replace(/["']/g, '').trim().toLowerCase();
      }

      function collectTypographyNodes(blocks, excludeSelector = '') {
        const runs = [];
        blocks.forEach((block) => {
          const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
          while (walker.nextNode()) {
            const textNode = walker.currentNode;
            const weight = [...(textNode.nodeValue || '').replace(/\s/g, '')].length;
            if (!weight) continue;
            const element = textNode.parentElement || block;
            if (excludeSelector && element.closest(excludeSelector)) continue;
            runs.push({ node: element, weight });
          }
        });
        return runs;
      }

      function weightedMode(runs, readValue) {
        const weights = new Map();
        runs.forEach((run) => {
          const value = readValue(run.node);
          weights.set(value, (weights.get(value) || 0) + run.weight);
        });
        return [...weights.entries()].sort((a, b) => b[1] - a[1])[0]?.[0];
      }

      function auditTypography(runs, allowEmpty = false) {
        const dominantSize = Number(weightedMode(runs, (node) => pxValue(getComputedStyle(node).fontSize).toFixed(2))) || 0;
        const dominantFont = weightedMode(runs, (node) => primaryFontName(getComputedStyle(node).fontFamily)) || '';
        const sizeErrorNodes = [...new Set(runs
          .filter(({ node }) => Math.abs(pxValue(getComputedStyle(node).fontSize) - dominantSize) > 0.2)
          .map(({ node }) => node))];
        const fontErrorNodes = [...new Set(runs
          .filter(({ node }) => primaryFontName(getComputedStyle(node).fontFamily) !== dominantFont)
          .map(({ node }) => node))];
        return {
          pass: (allowEmpty && runs.length === 0) || (runs.length > 0 && sizeErrorNodes.length === 0 && fontErrorNodes.length === 0),
          detail: runs.length ? `主流 ${dominantSize}px · 字号偏差 ${sizeErrorNodes.length} · 字体偏差 ${fontErrorNodes.length}` : '未检测到内容（已跳过）',
          dominantSize,
          dominantFont,
          sizeErrorNodes,
          fontErrorNodes
        };
      }

      function auditAppearance(runs, allowEmpty = false) {
        const dominantColor = weightedMode(runs, (node) => rgbToHex(getComputedStyle(node).color).toLowerCase()) || '';
        const dominantWeight = weightedMode(runs, (node) => Number(getComputedStyle(node).fontWeight) >= 600 ? 'bold' : 'regular') || 'regular';
        const errorNodes = [...new Set(runs.filter(({ node }) => {
          const style = getComputedStyle(node);
          return rgbToHex(style.color).toLowerCase() !== dominantColor || (Number(style.fontWeight) >= 600 ? 'bold' : 'regular') !== dominantWeight;
        }).map(({ node }) => node))];
        return {
          pass: (allowEmpty && runs.length === 0) || (runs.length > 0 && errorNodes.length === 0),
          detail: runs.length ? `主流 ${dominantColor} · ${dominantWeight === 'bold' ? '粗体' : '常规'} · 偏差 ${errorNodes.length}` : '未检测到内容（已跳过）',
          errorNodes
        };
      }

      function auditTitleAppearance(runs) {
        const groupedRuns = new Map();
        runs.forEach((run) => {
          const part = run.node.closest('[data-wechat-title-part]')?.dataset.wechatTitlePart || 'regular';
          if (!groupedRuns.has(part)) groupedRuns.set(part, []);
          groupedRuns.get(part).push(run);
        });
        if (!groupedRuns.size) return auditAppearance([], true);
        const audits = [...groupedRuns.entries()].map(([part, partRuns]) => ({ part, ...auditAppearance(partRuns, true) }));
        const partLabels = { number: '序号', box: '标题框', title: '标题', regular: '标题' };
        return {
          pass: audits.every((audit) => audit.pass),
          detail: audits.map((audit) => `${partLabels[audit.part] || audit.part}：${audit.detail}`).join(' · '),
          errorNodes: [...new Set(audits.flatMap((audit) => audit.errorNodes))]
        };
      }

      function clearFormatWarnings() {
        editor.querySelectorAll('[data-format-warning]').forEach((node) => node.removeAttribute('data-format-warning'));
      }

      function markFormatWarnings(nodes, reason) {
        const uniqueNodes = [...new Set(nodes)].filter((node) => node?.isConnected && editor.contains(node));
        const outermostNodes = uniqueNodes.filter((node) => !uniqueNodes.some((other) => other !== node && other.contains(node)));
        outermostNodes.forEach((node) => {
          const existing = node.getAttribute('data-format-warning');
          node.setAttribute('data-format-warning', existing ? `${existing}；${reason}` : reason);
        });
        return outermostNodes;
      }

      function revealFormatIssue(item, row) {
        clearFormatWarnings();
        checks.querySelectorAll('.check-row.active').forEach((node) => node.classList.remove('active'));
        const markedNodes = markFormatWarnings(item.nodes || [], item.reason || item.label);
        if (!markedNodes.length) return;
        row.classList.add('active');
        markedNodes[0].scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
      }

      function validateFormat() {
        clearFormatWarnings();
        const blocks = [...editor.children].filter((block) => !block.hasAttribute('data-guidance-marker'));
        const titles = blocks.filter((block) => block.dataset.wechatRole === 'chapter-title');
        const articleTitles = blocks.filter((block) => block.dataset.wechatRole === 'article-title');
        const bodies = blocks.filter((block) => block.dataset.wechatRole === 'body');
        const authors = blocks.filter((block) => block.dataset.wechatRole === 'author');
        const intros = blocks.filter((block) => block.dataset.wechatRole === 'intro');
        const emphases = [...editor.querySelectorAll('strong, b, mark, [data-wechat-role="emphasis"], [data-wechat-role="emphasis-blue"], [data-wechat-role="emphasis-color"]')]
          .filter((node) => !node.closest('[data-guidance-marker]'));
        const emphasisSelector = 'strong, b, mark, [data-wechat-role="emphasis"], [data-wechat-role="emphasis-blue"], [data-wechat-role="emphasis-color"]';
        const titleNodes = collectTypographyNodes(titles);
        const bodyNodes = collectTypographyNodes(bodies, emphasisSelector);
        const emphasisNodes = collectTypographyNodes(emphases);
        const titleTypography = auditTypography(titleNodes, true);
        const bodyTypography = auditTypography(bodyNodes);
        const emphasisTypography = auditTypography(emphasisNodes, true);
        const titleAppearance = auditTitleAppearance(titleNodes);
        const bodyAppearance = auditAppearance(bodyNodes);
        const emphasisAppearance = auditAppearance(emphasisNodes, true);

        const spacedBodies = blocks.filter((block) => block.dataset.wechatRole !== 'chapter-title');
        const dominantSpacing = Number(mode(spacedBodies.map((block) => pxValue(getComputedStyle(block).marginBottom).toFixed(2)))) || 0;
        const spacingErrors = spacedBodies.filter((block) => Math.abs(pxValue(getComputedStyle(block).marginBottom) - dominantSpacing) > 0.2);
        const spacingPass = spacingErrors.length === 0;
        const dominantIndent = mode(blocks.map((block) => {
          const style = getComputedStyle(block);
          return `${pxValue(style.marginLeft).toFixed(2)}|${pxValue(style.marginRight).toFixed(2)}`;
        })) || '0|0';
        const [dominantIndentLeft, dominantIndentRight] = dominantIndent.split('|').map(Number);
        const indentErrors = blocks.filter((block) => {
          const style = getComputedStyle(block);
          return Math.abs(pxValue(style.marginLeft) - dominantIndentLeft) > 0.2 || Math.abs(pxValue(style.marginRight) - dominantIndentRight) > 0.2;
        });
        const indentPass = indentErrors.length === 0;

        const results = [
          { label: '章节标题字体与字号', detail: titleTypography.detail, pass: titleTypography.pass, nodes: [...titleTypography.sizeErrorNodes, ...titleTypography.fontErrorNodes], reason: '标题字体或字号属于少数格式' },
          { label: '章节标题颜色与粗细', detail: titleAppearance.detail, pass: titleAppearance.pass, nodes: titleAppearance.errorNodes, reason: '标题颜色或粗细属于少数格式' },
          { label: '正文字体与字号', detail: bodyTypography.detail, pass: bodyTypography.pass, nodes: [...bodyTypography.sizeErrorNodes, ...bodyTypography.fontErrorNodes], reason: '正文字体或字号属于少数格式' },
          { label: '正文颜色与粗细', detail: bodyAppearance.detail, pass: bodyAppearance.pass, nodes: bodyAppearance.errorNodes, reason: '正文颜色或粗细属于少数格式' },
          { label: '重点字字体与字号', detail: emphasisTypography.detail, pass: emphasisTypography.pass, nodes: [...emphasisTypography.sizeErrorNodes, ...emphasisTypography.fontErrorNodes], reason: '重点字体或字号属于少数格式' },
          { label: '重点字颜色与粗细', detail: emphasisAppearance.detail, pass: emphasisAppearance.pass, nodes: emphasisAppearance.errorNodes, reason: '重点颜色或粗细属于少数格式' },
          { label: '语义识别', detail: `全文标题 ${articleTitles.length} · 作者 ${authors.length} · 导语 ${intros.length}`, pass: true, nodes: [] },
          { label: '两端缩进一致性', detail: `主流 ${dominantIndentLeft}px / ${dominantIndentRight}px · 偏差 ${indentErrors.length}`, pass: indentPass, nodes: indentErrors, reason: '两端缩进属于少数格式' },
          { label: '段落间距一致性', detail: `主流 ${dominantSpacing}px · 偏差 ${spacingErrors.length}`, pass: spacingPass, nodes: spacingErrors, reason: '段落间距属于少数格式' }
        ];

        renderChecks(results);
        results.filter((item) => !item.pass && item.nodes?.length).forEach((item) => {
          markFormatWarnings(item.nodes, item.reason || item.label);
        });
        updateOutput();
        return results.every((item) => item.pass);
      }

      function scheduleValidation() {
        window.clearTimeout(validationTimer);
        status.className = 'status';
        status.innerHTML = '<span class="status-dot"></span><span>正在实时检查……</span>';
        mobileCheckState.className = 'mobile-check-state';
        mobileCheckState.textContent = '正在实时检查……';
        validationTimer = window.setTimeout(validateFormat, 180);
      }

      function renderChecks(results) {
        if (!results) {
          status.className = 'status';
          status.innerHTML = '<span class="status-dot"></span><span>等待检查</span>';
          checks.innerHTML = '';
          mobileCheckState.className = 'mobile-check-state';
          mobileCheckState.textContent = '实时检查已开启';
          return;
        }

        const failedResults = results
          .map((item, index) => ({ item, index }))
          .filter(({ item }) => !item.pass);
        const passed = failedResults.length === 0;
        status.className = passed ? 'status' : 'status warning';
        status.innerHTML = `<span class="status-dot"></span><span>${passed ? '格式一致' : `${failedResults.length} 项待修正`}</span>`;
        mobileCheckState.className = `mobile-check-state ${passed ? '' : 'warning'}`;
        mobileCheckState.textContent = passed ? '格式一致' : '发现格式偏差';
        checks.innerHTML = failedResults.map(({ item, index }) => {
          const actionable = !item.pass && item.nodes?.length;
          return `
          <div class="check-row ${item.pass ? '' : 'fail'} ${actionable ? 'actionable' : ''}" ${actionable ? `data-check-index="${index}" role="button" tabindex="0"` : ''}>
            <span class="swatch ${item.pass ? '' : 'space'}"></span>
            <span>${item.label}</span>
            <span class="result">${item.detail}${actionable ? '<small class="locate-hint">点击定位</small>' : ''}</span>
          </div>
        `;
        }).join('');
        checks.querySelectorAll('[data-check-index]').forEach((row) => {
          const reveal = () => revealFormatIssue(results[Number(row.dataset.checkIndex)], row);
          row.addEventListener('click', reveal);
          row.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            reveal();
          });
        });
      }

      function updateOutput() {
        htmlOutput.value = `<section style="font-size:${currentBodySize}px;line-height:1.8;color:${BODY_COLOR};text-align:left;word-break:break-word;font-family:${selectedFontStack};">\n${sanitizedEditorHtml()}\n</section>`;
      }

      function copyRichText(feedbackButton = copyButton) {
        normalizeEditorImages();
        const copyStage = document.createElement('div');
        const cleanClone = sanitizedEditorClone();
        copyStage.setAttribute('style', 'position:fixed;left:-10000px;top:0;width:620px;background:#fff;pointer-events:none;');
        copyStage.append(...cleanClone.childNodes);
        document.body.appendChild(copyStage);
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(copyStage);
        selection.removeAllRanges();
        selection.addRange(range);
        const copied = document.execCommand('copy');
        selection.removeAllRanges();
        copyStage.remove();
        const originalText = feedbackButton.textContent;
        feedbackButton.textContent = copied ? '已复制' : '复制失败';
        window.setTimeout(() => { feedbackButton.textContent = originalText; }, 2200);
      }

      function extractAgentJsonCandidate(value) {
        let candidate = String(value || '').trim()
          .replace(/^```(?:json|javascript|js)?\s*/i, '')
          .replace(/\s*```$/i, '')
          .trim();
        const openers = [candidate.indexOf('{'), candidate.indexOf('｛')].filter((index) => index >= 0);
        const firstBrace = openers.length ? Math.min(...openers) : -1;
        const lastBrace = Math.max(candidate.lastIndexOf('}'), candidate.lastIndexOf('｝'));
        if (firstBrace >= 0 && lastBrace > firstBrace) candidate = candidate.slice(firstBrace, lastBrace + 1);
        return candidate;
      }

      function isJsonStringBoundary(source, quoteIndex) {
        let cursor = quoteIndex + 1;
        while (cursor < source.length && /\s/.test(source[cursor])) cursor += 1;
        if (cursor >= source.length) return true;
        const next = source[cursor];
        if (':：,;}｝]］'.includes(next)) return true;
        if (next !== '，' && next !== '；') return false;

        cursor += 1;
        let crossedLine = false;
        while (cursor < source.length && /\s/.test(source[cursor])) {
          if (/\r|\n/.test(source[cursor])) crossedLine = true;
          cursor += 1;
        }
        const afterSeparator = source[cursor] || '';
        return crossedLine || '"\'“‘{[｛［}｝]］'.includes(afterSeparator);
      }

      function normalizeJsonPunctuation(value) {
        const source = extractAgentJsonCandidate(value);
        const quotePairs = { '"': '"', "'": "'", '“': '”', '‘': '’', '”': '”', '’': '’' };
        const structural = { '｛': '{', '｝': '}', '［': '[', '］': ']', '：': ':', '，': ',', '；': ',', ';': ',' };
        let output = '';
        let inString = false;
        let closingQuote = '';
        let escaped = false;

        for (let index = 0; index < source.length; index += 1) {
          const character = source[index];
          if (!inString) {
            if (quotePairs[character]) {
              inString = true;
              closingQuote = quotePairs[character];
              output += '"';
            } else {
              output += structural[character] || (character === '\u00a0' ? ' ' : character);
            }
            continue;
          }

          if (escaped) {
            output += character;
            escaped = false;
            continue;
          }
          if (character === '\\') {
            output += character;
            escaped = true;
            continue;
          }
          if (character === closingQuote && isJsonStringBoundary(source, index)) {
            output += '"';
            inString = false;
            closingQuote = '';
            continue;
          }
          if (character === '"') {
            output += '\\"';
          } else if (character === '\r' || character === '\n' || character === '\t') {
            output += ' ';
          } else {
            output += character;
          }
        }

        if (inString) throw new Error('字符串引号没有闭合');
        return output;
      }

      function removeTrailingJsonCommas(value) {
        let output = '';
        let inString = false;
        let escaped = false;
        for (let index = 0; index < value.length; index += 1) {
          const character = value[index];
          if (inString) {
            output += character;
            if (escaped) escaped = false;
            else if (character === '\\') escaped = true;
            else if (character === '"') inString = false;
            continue;
          }
          if (character === '"') {
            inString = true;
            output += character;
            continue;
          }
          if (character === ',') {
            let cursor = index + 1;
            while (cursor < value.length && /\s/.test(value[cursor])) cursor += 1;
            if (value[cursor] === '}' || value[cursor] === ']') continue;
          }
          output += character;
        }
        return output;
      }

      function parseAgentJsonPayload(value) {
        const candidate = extractAgentJsonCandidate(value);
        try {
          return { payload: JSON.parse(candidate), repaired: false };
        } catch {
          const repairedCandidate = removeTrailingJsonCommas(normalizeJsonPunctuation(candidate));
          return { payload: JSON.parse(repairedCandidate), repaired: repairedCandidate !== candidate };
        }
      }

      function semanticBlocksFromPlainText(value) {
        const normalized = value.replace(/\r\n?/g, '\n').trim();
        if (!normalized) return [];
        let paragraphs = normalized.split(/\n\s*\n+/).map((text) => text.replace(/\s*\n\s*/g, ' ').trim()).filter(Boolean);
        if (paragraphs.length === 1 && normalized.includes('\n')) {
          paragraphs = normalized.split('\n').map((text) => text.trim()).filter(Boolean);
        }

        const firstMeaningfulIndex = paragraphs.findIndex((text) => !articleMetadataPattern.test(text));
        const articleTitleIndex = firstMeaningfulIndex >= 0 && isLikelyArticleTitle(paragraphs[firstMeaningfulIndex]) ? firstMeaningfulIndex : -1;
        const firstTitleIndex = paragraphs.findIndex((text, index) => index !== articleTitleIndex && isLikelyBasicTitle(text));
        let firstContentSeen = false;
        return paragraphs.map((text, index) => {
          if (index === articleTitleIndex) return { role: 'article-title', text };
          if (basicAuthorPattern.test(text)) return { role: 'author', text };
          if (isLikelyBasicTitle(text)) return { role: 'chapter-title', text };
          if ((firstTitleIndex > 0 && index < firstTitleIndex) || (firstTitleIndex < 0 && !firstContentSeen)) {
            firstContentSeen = true;
            return { role: 'intro', text };
          }
          firstContentSeen = true;
          return { role: 'body', text };
        });
      }

      function semanticBlocksFromObject(payload) {
        if (Array.isArray(payload.blocks)) {
          return payload.blocks
            .filter((item) => item && item.text)
            .map((item) => ({ role: item.role || 'body', text: String(item.text), highlights: item.highlights || [] }));
        }

        const blocks = [];
        const articleTitle = payload.article_title || payload.articleTitle || payload.title;
        if (articleTitle) blocks.push({ role: 'article-title', text: String(articleTitle) });
        if (payload.author) blocks.push({ role: 'author', text: String(payload.author).match(authorPattern) ? String(payload.author) : `作者：${payload.author}` });
        const intros = Array.isArray(payload.intro) ? payload.intro : payload.intro ? [payload.intro] : [];
        intros.forEach((text) => blocks.push({ role: 'intro', text: String(text) }));
        (payload.sections || []).forEach((section) => {
          let remainingHighlightSlots = 3;
          if (section.title) blocks.push({ role: 'chapter-title', text: String(section.title) });
          const paragraphs = section.paragraphs || section.body || [];
          (Array.isArray(paragraphs) ? paragraphs : [paragraphs]).filter(Boolean).forEach((paragraph) => {
            if (typeof paragraph === 'object') {
              const requestedHighlights = Array.isArray(paragraph.highlights)
                ? paragraph.highlights
                : paragraph.highlights ? [paragraph.highlights] : [];
              const highlights = requestedHighlights.slice(0, remainingHighlightSlots);
              remainingHighlightSlots -= highlights.length;
              blocks.push({ role: 'body', text: String(paragraph.text || ''), highlights });
            } else {
              blocks.push({ role: 'body', text: String(paragraph), highlights: [] });
            }
          });
        });
        return blocks;
      }

      function expandHighlightToCompleteSentence(sourceText, highlightText) {
        const highlightIndex = sourceText.indexOf(highlightText);
        if (highlightIndex < 0) return null;
        const sentenceMarks = '。！？!?';
        let start = highlightIndex;
        for (let index = highlightIndex - 1; index >= 0; index -= 1) {
          if (sentenceMarks.includes(sourceText[index]) || sourceText[index] === '\n') {
            start = index + 1;
            break;
          }
          start = 0;
        }

        let end = sourceText.length;
        const highlightEnd = highlightIndex + highlightText.length;
        for (let index = highlightEnd; index < sourceText.length; index += 1) {
          if (!sentenceMarks.includes(sourceText[index])) continue;
          end = index + 1;
          while (end < sourceText.length && '”’"\'〉》』】'.includes(sourceText[end])) end += 1;
          break;
        }

        const rawSentence = sourceText.slice(start, end);
        const leadingWhitespace = rawSentence.match(/^\s*/)?.[0].length || 0;
        const sentence = rawSentence.trim();
        return sentence ? { text: sentence, index: start + leadingWhitespace } : null;
      }

      function applyParagraphHighlights(paragraph, highlights = []) {
        const sourceText = paragraph.textContent;
        const matches = highlights
          .map((highlight) => ({
            text: String(typeof highlight === 'string' ? highlight : highlight.text || '').trim(),
            color: currentAccentColor,
            role: 'emphasis'
          }))
          .filter((highlight) => highlight.text && sourceText.includes(highlight.text))
          .map((highlight) => {
            const sentenceMatch = expandHighlightToCompleteSentence(sourceText, highlight.text);
            return sentenceMatch ? { ...highlight, ...sentenceMatch } : null;
          })
          .filter(Boolean)
          .sort((a, b) => a.index - b.index);
        if (!matches.length) return;

        paragraph.textContent = '';
        let cursor = 0;
        matches.forEach((match) => {
          if (match.index < cursor) return;
          paragraph.appendChild(document.createTextNode(sourceText.slice(cursor, match.index)));
          const strong = document.createElement('strong');
          strong.dataset.wechatRole = match.role;
          strong.setAttribute('style', emphasisStyle(selectedFontStack, match.color));
          strong.textContent = match.text;
          paragraph.appendChild(strong);
          cursor = match.index + match.text.length;
        });
        paragraph.appendChild(document.createTextNode(sourceText.slice(cursor)));
      }

      function renderSemanticBlocks(blocks) {
        if (!blocks.length) throw new Error('没有可填入的正文内容');
        editor.innerHTML = '';
        const counts = { 'article-title': 0, author: 0, intro: 0, 'chapter-title': 0, body: 0 };

        blocks.forEach(({ role, text, highlights }) => {
          const normalizedRole = ['article-title', 'author', 'intro', 'chapter-title', 'body'].includes(role) ? role : 'body';
          const paragraph = document.createElement('p');
          paragraph.dataset.wechatRole = normalizedRole;
          paragraph.textContent = text.trim();
          if (normalizedRole === 'article-title') paragraph.setAttribute('style', articleTitleStyle());
          if (normalizedRole === 'author') paragraph.setAttribute('style', authorStyle());
          if (normalizedRole === 'intro') paragraph.setAttribute('style', introStyle());
          if (normalizedRole === 'chapter-title') {
            paragraph.dataset.titleOriginal = text.trim();
            paragraph.dataset.titleBase = stripTitleNumber(text.trim()) || text.trim();
            paragraph.setAttribute('style', titleStyle());
          }
          if (normalizedRole === 'body') paragraph.setAttribute('style', bodyStyle());
          applyParagraphHighlights(paragraph, highlights);
          editor.appendChild(paragraph);
          counts[normalizedRole] += 1;
        });

        convertMarkdownEmphasis(editor);
        editor.querySelectorAll('strong').forEach((element) => {
          if (element.dataset.wechatRole === 'emphasis-blue') {
            element.setAttribute('style', blueEmphasisStyle());
          } else {
            element.dataset.wechatRole = 'emphasis';
            element.setAttribute('style', emphasisStyle());
          }
        });
        applyTitleNumbering(currentTitleNumberStyle, false);
        savedEditorRange = null;
        lastToolbarTarget = null;
        lastToolbarBlocks = [];
        rememberOriginalArticle(true);
        updateOutput();
        renderChecks(null);
        agentStatus.textContent = `已识别：全文标题 ${counts['article-title']} · 作者 ${counts.author} · 导语 ${counts.intro} · 章节标题 ${counts['chapter-title']} · 正文 ${counts.body}`;
        return counts;
      }

      function importAgentContent(payload) {
        let blocks;
        let repairedJson = false;
        if (typeof payload === 'string') {
          const trimmed = payload.trim();
          if (!trimmed) throw new Error('请先粘贴文章内容');
          const jsonCandidate = extractAgentJsonCandidate(trimmed);
          const looksLikeJson = /^[{｛]/.test(jsonCandidate);
          if (looksLikeJson) {
            let parsedResult;
            try {
              parsedResult = parseAgentJsonPayload(jsonCandidate);
            } catch {
              throw new Error('返回内容像 JSON，但标点或引号仍无法识别，请让 Agent 重新返回标准 JSON');
            }
            if (!parsedResult.payload || typeof parsedResult.payload !== 'object' || Array.isArray(parsedResult.payload)) {
              throw new Error('JSON 必须是包含 author、intro 和 sections 的对象');
            }
            repairedJson = parsedResult.repaired;
            blocks = semanticBlocksFromObject(parsedResult.payload);
            if (!blocks.length) throw new Error('JSON 已解析，但没有找到可用的 author、intro、sections 或 blocks');
          } else {
            blocks = semanticBlocksFromPlainText(trimmed);
          }
        } else {
          blocks = semanticBlocksFromObject(payload || {});
        }
        const counts = renderSemanticBlocks(blocks);
        if (repairedJson) agentStatus.textContent = `已自动修复中文/全角标点 · ${agentStatus.textContent}`;
        return counts;
      }

      function restoreAgentPromptIfDamaged() {
        const wasChanged = agentPromptEditor.value !== lastValidAgentPrompt;
        agentPromptText = lastValidAgentPrompt;
        agentPromptEditor.value = lastValidAgentPrompt;
        return wasChanged;
      }

      async function copyAgentPrompt() {
        restoreAgentPromptIfDamaged();
        try {
          await navigator.clipboard.writeText(agentPromptText);
        } catch {
          const fallback = document.createElement('textarea');
          fallback.value = agentPromptText;
          fallback.setAttribute('style', 'position:fixed;left:-10000px;top:0;');
          document.body.appendChild(fallback);
          fallback.select();
          document.execCommand('copy');
          fallback.remove();
        }
        agentPromptButton.classList.add('copied');
        agentPromptButton.textContent = '已复制';
        window.setTimeout(() => {
          agentPromptButton.classList.remove('copied');
          agentPromptButton.textContent = '复制';
        }, 2200);
      }

      function currentThemeSnapshot(name = '') {
        return {
          id: `custom-${Date.now()}`,
          name,
          bodySize: currentBodySize,
          titleSize: currentTitleSize,
          indent: currentIndent,
          titleNumberStyle: currentTitleNumberStyle,
          fontKey: selectedFontKey,
          themeColor: currentAccentColor
        };
      }

      function readCustomThemes() {
        try {
          const parsed = JSON.parse(localStorage.getItem(THEME_STORAGE_KEY) || '[]');
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function writeCustomThemes(themes) {
        localStorage.setItem(THEME_STORAGE_KEY, JSON.stringify(themes));
      }

      function applyTheme(theme) {
        currentBodySize = Number(theme.bodySize) || 16;
        currentTitleSize = Number(theme.titleSize) || 32;
        currentIndent = [8, 16].includes(Number(theme.indent)) ? Number(theme.indent) : 8;
        currentTitleNumberStyle = ['arabic', 'chinese', 'chinese-line', 'chinese-box', 'none'].includes(theme.titleNumberStyle) ? theme.titleNumberStyle : 'arabic';
        selectedFontKey = FONT_STACKS[theme.fontKey] ? theme.fontKey : 'system';
        selectedFontStack = FONT_STACKS[selectedFontKey];
        setThemeColor(theme.themeColor || theme.accentColor || theme.titleColor || ORANGE);

        currentBodySizeLabel.textContent = `${currentBodySize}`;
        currentTitleSizeLabel.textContent = `${currentTitleSize}`;
        currentIndentLabel.textContent = `${currentIndent}`;
        formatAll();
        themeStatus.textContent = `已应用主题并完成检查：${theme.name}`;
      }

      function readableThemeTextColor(color) {
        const normalized = String(color || ORANGE).trim().replace('#', '');
        const hex = normalized.length === 3
          ? normalized.split('').map((part) => part + part).join('')
          : normalized.padEnd(6, '0').slice(0, 6);
        const channels = [0, 2, 4].map((offset) => Number.parseInt(hex.slice(offset, offset + 2), 16) || 0);
        const luminance = channels.reduce((sum, channel, index) => sum + channel * [0.299, 0.587, 0.114][index], 0);
        return luminance > 158 ? '#28231f' : '#ffffff';
      }

      function renderThemeControls() {
        themePresets.innerHTML = '';
        BUILTIN_THEMES.forEach((theme) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'theme-chip';
          button.style.setProperty('--theme-color', theme.themeColor);
          button.textContent = theme.name;
          button.addEventListener('click', () => applyTheme(theme));
          themePresets.appendChild(button);
        });

        customThemeList.innerHTML = '';
        readCustomThemes().forEach((theme) => {
          const row = document.createElement('div');
          row.className = 'custom-theme-row';
          row.style.setProperty('--theme-color', theme.themeColor || ORANGE);
          row.style.setProperty('--theme-ink', readableThemeTextColor(theme.themeColor || ORANGE));
          const applyButton = document.createElement('button');
          applyButton.type = 'button';
          applyButton.className = 'saved-theme-apply';
          applyButton.textContent = theme.name;
          applyButton.setAttribute('aria-label', `应用主题 ${theme.name}`);
          applyButton.addEventListener('click', () => applyTheme(theme));
          const editButton = document.createElement('button');
          editButton.type = 'button';
          editButton.className = 'theme-overlay-action theme-edit';
          editButton.setAttribute('aria-label', `修改主题 ${theme.name}`);
          editButton.title = '修改主题';
          editButton.textContent = '✎';
          editButton.addEventListener('click', () => {
            applyTheme(theme);
            editingThemeId = theme.id;
            themeNameInput.value = theme.name;
            saveThemeButton.textContent = '更新';
            themeStatus.textContent = `正在编辑：${theme.name}`;
          });
          const deleteButton = document.createElement('button');
          deleteButton.type = 'button';
          deleteButton.className = 'theme-overlay-action theme-delete';
          deleteButton.setAttribute('aria-label', `删除主题 ${theme.name}`);
          deleteButton.title = '删除主题';
          deleteButton.textContent = '×';
          deleteButton.addEventListener('click', () => {
            writeCustomThemes(readCustomThemes().filter((item) => item.id !== theme.id));
            if (editingThemeId === theme.id) {
              editingThemeId = null;
              themeNameInput.value = '';
              saveThemeButton.textContent = '保存当前';
            }
            renderThemeControls();
            themeStatus.textContent = `已删除主题：${theme.name}`;
          });
          row.append(applyButton, deleteButton, editButton);
          customThemeList.appendChild(row);
        });
      }

      function saveCurrentTheme() {
        const name = themeNameInput.value.trim();
        if (!name) {
          themeStatus.textContent = '请先填写主题名称';
          return;
        }
        const themes = readCustomThemes();
        const existingIndex = editingThemeId
          ? themes.findIndex((theme) => theme.id === editingThemeId)
          : themes.findIndex((theme) => theme.name === name);
        const snapshot = currentThemeSnapshot(name);
        if (existingIndex >= 0) themes.splice(existingIndex, 1, { ...snapshot, id: themes[existingIndex].id });
        else themes.push(snapshot);
        writeCustomThemes(themes);
        editingThemeId = null;
        themeNameInput.value = '';
        saveThemeButton.textContent = '保存当前';
        renderThemeControls();
        themeStatus.textContent = `主题“${name}”已保存`;
      }

      function mode(values) {
        const counts = new Map();
        values.filter((value) => value !== undefined && value !== null && value !== '').forEach((value) => counts.set(value, (counts.get(value) || 0) + 1));
        return [...counts.entries()].sort((a, b) => b[1] - a[1])[0]?.[0];
      }

      function nearest(value, choices) {
        return choices.reduce((best, choice) => Math.abs(choice - value) < Math.abs(best - value) ? choice : best, choices[0]);
      }

      function rgbToHex(value) {
        const parts = value.match(/\d+/g)?.slice(0, 3).map(Number);
        if (!parts || parts.length < 3) return value;
        return `#${parts.map((part) => part.toString(16).padStart(2, '0')).join('')}`;
      }

      function inferFontKey(fontFamily) {
        const value = (fontFamily || '').toLowerCase();
        if (value.includes('kaiti') || value.includes('kaiti') || value.includes('楷')) return 'kaiti';
        if (value.includes('song') || value.includes('simsun') || value.includes('serif')) return 'songti';
        if (value.includes('pingfang') || value.includes('yahei') || value.includes('sans')) return 'heiti';
        return 'system';
      }

      function learnPastedStyle() {
        const text = styleSample.innerText.trim();
        if (!text) {
          learnStyleStatus.textContent = '请先粘贴一篇带格式的公众号文章';
          return;
        }
        if (!styleSample.querySelector('[style], font, h1, h2, h3, h4, strong, b')) {
          learnStyleStatus.textContent = '未检测到富文本格式，请从公众号编辑器中直接复制后粘贴';
          return;
        }

        let blocks = [...styleSample.querySelectorAll('p, h1, h2, h3, h4')].filter((element) => element.innerText.trim());
        if (!blocks.length) {
          blocks = [...styleSample.querySelectorAll('div, section')].filter((element) => element.innerText.trim() && !element.querySelector('div, section, p'));
        }
        const metrics = blocks.map((element) => {
          const style = getComputedStyle(element);
          return {
            element,
            text: element.innerText.trim(),
            size: pxValue(style.fontSize),
            lineHeight: pxValue(style.lineHeight),
            marginBottom: pxValue(style.marginBottom),
            marginLeft: pxValue(style.marginLeft),
            marginRight: pxValue(style.marginRight),
            weight: Number(style.fontWeight) || 400,
            color: rgbToHex(style.color),
            fontFamily: style.fontFamily
          };
        });
        const titleMetrics = metrics.filter((item) => item.size >= 20 && item.text.length <= 60);
        const bodyMetrics = metrics.filter((item) => item.size >= 12 && item.size < 20 && item.text.length >= 12);
        const bodySizeRaw = Number(mode(bodyMetrics.map((item) => Math.round(item.size)))) || 16;
        const titleSizeRaw = Number(mode(titleMetrics.map((item) => Math.round(item.size)))) || 32;
        const bilateralIndentRaw = Number(mode(bodyMetrics.map((item) => Math.round((item.marginLeft + item.marginRight) / 2)))) || 8;
        const bodyFont = mode(bodyMetrics.map((item) => item.fontFamily)) || FONT_STACKS.system;
        const titleColor = mode(titleMetrics.map((item) => item.color)) || ORANGE;
        const emphasisColors = [...styleSample.querySelectorAll('strong, b, [style*="color"]')]
          .map((element) => ({ color: rgbToHex(getComputedStyle(element).color), weight: Number(getComputedStyle(element).fontWeight) || 400 }))
          .filter((item) => item.weight >= 600 && item.color !== titleColor)
          .map((item) => item.color);

        const learnedTheme = {
          id: 'learned',
          name: '剪贴板样稿',
          bodySize: nearest(bodySizeRaw, [14, 15, 16]),
          titleSize: nearest(titleSizeRaw, [24, 32]),
          indent: nearest(bilateralIndentRaw, [8, 16]),
          titleNumberStyle: currentTitleNumberStyle,
          fontKey: inferFontKey(bodyFont),
          themeColor: mode(emphasisColors) || titleColor || ORANGE
        };
        applyTheme(learnedTheme);

        const averageLineHeight = mode(bodyMetrics.map((item) => item.size ? (item.lineHeight / item.size).toFixed(2) : '')) || '1.80';
        const paragraphGap = mode(bodyMetrics.map((item) => Math.round(item.marginBottom))) || 24;
        agentPromptText = `${AGENT_PROMPT}\n\n${AGENT_PROMPT_SENTENCE_RULE}\n\n从参考公众号样稿学习到的版式：正文约 ${bodySizeRaw}px，行高约 ${averageLineHeight}，段距约 ${paragraphGap}px，两端缩进约 ${learnedTheme.indent}px；章节标题约 ${titleSizeRaw}px；主题色 ${learnedTheme.themeColor}。请按这些视觉层级判断版序，但仍只返回上述 JSON，不要返回 HTML。`;
        lastValidAgentPrompt = agentPromptText;
        agentPromptEditor.value = agentPromptText;
        learnStyleStatus.textContent = `正文 ${bodySizeRaw}px · 标题 ${titleSizeRaw}px · 缩进 ${learnedTheme.indent}px`;
      }

      function isPublicWechatArticleUrl(value) {
        try {
          const url = new URL(value);
          return url.protocol === 'https:' && url.hostname === 'mp.weixin.qq.com';
        } catch {
          return false;
        }
      }

      async function learnStyleFromWechatLink(sourceUrl) {
        if (!isPublicWechatArticleUrl(sourceUrl)) {
          learnStyleStatus.textContent = '请粘贴公开的公众号文章链接';
          return;
        }

        learnStyleButton.disabled = true;
        learnStyleButton.textContent = '读取中';
        learnStyleStatus.textContent = '正在读取公开文章版式……';
        try {
          const response = await fetch('http://127.0.0.1:4318/api/learn-wechat-style', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: sourceUrl })
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload.html) throw new Error(payload.error || '没有读取到文章正文');
          styleSample.innerHTML = payload.html;
          learnPastedStyle();
          const summary = learnStyleStatus.textContent;
          learnStyleStatus.textContent = `${payload.title ? `《${payload.title}》` : '公开文章'} · ${summary}`;
        } catch (error) {
          const helperHint = error instanceof TypeError
            ? '未连接本机链接读取助手；可启动端侧助手，或复制带格式全文后粘贴到这里'
            : error.message;
          learnStyleStatus.textContent = helperHint;
        } finally {
          learnStyleButton.disabled = false;
          learnStyleButton.textContent = '应用';
        }
      }

      function learnCurrentStyleSource() {
        const sourceText = styleSample.innerText.trim();
        const isSingleWechatLink = sourceText && !/\s/.test(sourceText) && isPublicWechatArticleUrl(sourceText);
        if (isSingleWechatLink) return learnStyleFromWechatLink(sourceText);
        learnPastedStyle();
      }

      window.WeChatWorkbench = {
        importArticle: importAgentContent,
        schema: { author: 'string', intro: 'string[]', sections: '{ title, paragraphs[] }[]' },
        prompt: () => agentPromptText
      };

      function sanitizeAnnotationText(value) {
        return value
          .replace(/\r\n?/g, '\n')
          .replace(/\u00a0/g, ' ')
          .replace(/[\u200b\u200c\u200d\ufeff]/g, '')
          .replace(/[ \t]+\n/g, '\n')
          .replace(/\n[ \t]*\n+/g, '\n')
          .trim();
      }

      function buildAnnotationBox(value) {
        const plainText = sanitizeAnnotationText(value);
        const box = document.createElement('section');
        box.dataset.wechatComponent = 'scrolling-annotation';
        box.setAttribute(
          'style',
          'height:84px;max-height:84px;overflow-y:auto;-webkit-overflow-scrolling:touch;' +
          'margin:24px 0;padding:10px 12px;border:1px solid #e5e5e5;border-radius:6px;' +
          'box-sizing:border-box;background:#f7f7f7;color:#777777;font-size:12px;' +
          'line-height:1;letter-spacing:0;text-align:left;word-break:break-word;'
        );

        const paragraph = document.createElement('p');
        paragraph.setAttribute('style', 'margin:0;padding:0;font-size:12px;line-height:1;letter-spacing:0;color:#777777;');
        if (plainText) {
          plainText.split('\n').forEach((line, index, lines) => {
            paragraph.appendChild(document.createTextNode(line));
            if (index < lines.length - 1) paragraph.appendChild(document.createElement('br'));
          });
        } else {
          paragraph.innerHTML = '&#8203;';
        }
        box.appendChild(paragraph);
        return { box, plainText };
      }

      async function copyAnnotationBox() {
        const { box: annotationBox, plainText } = buildAnnotationBox(annotationInput.value);
        const richHtml = annotationBox.outerHTML;
        let copied = false;

        if (navigator.clipboard?.write && window.ClipboardItem) {
          try {
            await navigator.clipboard.write([
              new ClipboardItem({
                'text/html': new Blob([richHtml], { type: 'text/html' }),
                'text/plain': new Blob([plainText || '\u200b'], { type: 'text/plain' })
              })
            ]);
            copied = true;
          } catch {
            copied = false;
          }
        }

        if (!copied) {
        const clipboardStage = document.createElement('div');
        clipboardStage.setAttribute(
          'style',
          'position:fixed;left:-10000px;top:0;width:620px;background:#ffffff;pointer-events:none;'
        );
        clipboardStage.appendChild(annotationBox);
        document.body.appendChild(clipboardStage);

        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(clipboardStage);
        selection.removeAllRanges();
        selection.addRange(range);
        copied = document.execCommand('copy');
        selection.removeAllRanges();
        clipboardStage.remove();
        }

        annotationCopyButton.textContent = copied ? '已复制滚动框' : '复制失败，请重试';
        annotationCopyStatus.textContent = copied ? '原格式已清除，可粘贴到微信测试' : '';
        window.setTimeout(() => {
          annotationCopyButton.textContent = '复制滚动框';
          annotationCopyStatus.textContent = '';
        }, 2600);
      }

      document.getElementById('format-all').addEventListener('click', formatAll);
      basicIdentifyButton.addEventListener('click', () => basicIdentifyStructure(basicIdentifyButton));
      document.getElementById('validate').addEventListener('click', validateFormat);
      document.getElementById('reset-sample').addEventListener('click', restoreOriginalArticle);
      copyButton.addEventListener('click', () => copyRichText(copyButton));
      annotationCopyButton.addEventListener('click', copyAnnotationBox);
      agentImportButton.addEventListener('click', () => {
        try {
          importAgentContent(agentInput.value);
        } catch (error) {
          agentStatus.textContent = error.message;
        }
      });
      agentPromptButton.addEventListener('click', copyAgentPrompt);
      agentPromptEditor.addEventListener('input', () => {
        agentPromptText = agentPromptEditor.value;
      });
      agentPromptEditor.addEventListener('blur', restoreAgentPromptIfDamaged);
      document.addEventListener('pointerdown', (event) => {
        if (event.target !== agentPromptEditor) restoreAgentPromptIfDamaged();
      }, true);
      learnStyleButton.addEventListener('click', learnCurrentStyleSource);
      saveThemeButton.addEventListener('click', saveCurrentTheme);
      appearanceToggle.addEventListener('click', cycleAppearance);
      mobilePreviewToggle.addEventListener('mouseenter', openMobilePublishPreview);
      mobilePreviewToggle.addEventListener('mouseleave', scheduleMobilePublishPreviewClose);
      mobilePreviewToggle.addEventListener('focus', openMobilePublishPreview);
      mobilePreviewToggle.addEventListener('blur', scheduleMobilePublishPreviewClose);
      mobilePreviewToggle.addEventListener('click', () => {
        window.location.href = 'mobile.html';
      });
      mobilePublishPreview.addEventListener('mouseenter', () => window.clearTimeout(mobilePreviewCloseTimer));
      mobilePublishPreview.addEventListener('mouseleave', scheduleMobilePublishPreviewClose);
      mobilePublishPreview.addEventListener('focusin', () => window.clearTimeout(mobilePreviewCloseTimer));
      mobilePublishPreview.addEventListener('focusout', scheduleMobilePublishPreviewClose);
      mobilePreviewCloseButton.addEventListener('click', closeMobilePublishPreview);
      searchToggle.addEventListener('click', toggleDocumentSearch);
      documentSearchInput.addEventListener('input', () => updateDocumentSearch(true));
      searchPreviousButton.addEventListener('click', () => moveDocumentSearch(-1));
      searchNextButton.addEventListener('click', () => moveDocumentSearch(1));
      searchCloseButton.addEventListener('click', closeDocumentSearch);
      documentSearchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeDocumentSearch();
          searchToggle.focus();
        } else if (event.key === 'Enter') {
          event.preventDefault();
          moveDocumentSearch(event.shiftKey ? -1 : 1);
        }
      });
      annotationInput.addEventListener('paste', (event) => {
        event.preventDefault();
        const plainText = sanitizeAnnotationText(event.clipboardData.getData('text/plain'));
        annotationInput.setRangeText(
          plainText,
          annotationInput.selectionStart,
          annotationInput.selectionEnd,
          'end'
        );
      });
      editor.addEventListener('input', () => {
        dismissGuidanceSample();
        detectTopAuthorLine();
        syncThemeEmphasis();
        updateOutput();
        scheduleValidation();
      });
      editor.addEventListener('paste', (event) => {
        const imageFiles = [...(event.clipboardData?.items || [])]
          .filter((item) => item.kind === 'file' && item.type.startsWith('image/'))
          .map((item) => item.getAsFile())
          .filter(Boolean);
        if (imageFiles.length) {
          event.preventDefault();
          insertImageFiles(imageFiles).catch(() => {
            status.className = 'status warning';
            status.innerHTML = '<span class="status-dot"></span><span>图片插入失败</span>';
          });
          return;
        }
        dismissGuidanceSample();
        window.setTimeout(() => {
          normalizeEditorImages();
          detectTopAuthorLine();
          rememberOriginalArticle(false);
          updateOutput();
        }, 0);
      });
      editor.addEventListener('keydown', (event) => {
        if (!(event.metaKey || event.ctrlKey)) return;
        if (event.key.toLowerCase() === 'c' && selectedEditorImage()) {
          event.preventDefault();
          copySelectedImage();
          return;
        }
        if (event.key.toLowerCase() !== 'z') return;
        event.preventDefault();
        if (event.shiftKey) redoEditorChange();
        else undoEditorChange();
      });
      editor.addEventListener('mousedown', () => {
        savedEditorRange = null;
        lastToolbarTarget = null;
        lastToolbarBlocks = [];
      });
      editor.addEventListener('click', (event) => {
        const image = event.target.closest?.('img');
        editor.querySelectorAll('img[data-image-selected]').forEach((node) => node.removeAttribute('data-image-selected'));
        if (image && editor.contains(image)) image.dataset.imageSelected = 'true';
      });
      document.addEventListener('selectionchange', rememberEditorSelection);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !mobilePublishPreview.hidden) closeMobilePublishPreview();
      });
      document.addEventListener('pointerdown', (event) => {
        document.querySelectorAll('.tool-menu[open]').forEach((menu) => {
          if (!menu.contains(event.target)) menu.removeAttribute('open');
        });
        if (!documentSearch.hidden && !documentSearch.contains(event.target) && !searchToggle.contains(event.target)) {
          closeDocumentSearch();
        }
      });

      document.querySelectorAll('.tool-menu summary').forEach((summary) => {
        summary.addEventListener('mousedown', (event) => {
          rememberEditorSelection();
          event.preventDefault();
        });
      });

      document.querySelectorAll('[data-body-size]').forEach((button) => {
        button.addEventListener('mousedown', (event) => event.preventDefault());
        button.addEventListener('click', () => {
          restoreEditorSelection();
          applyBlockRole('body', button.dataset.bodySize);
          document.getElementById('body-size-menu').removeAttribute('open');
        });
      });

      document.querySelectorAll('[data-title-size]').forEach((button) => {
        button.addEventListener('mousedown', (event) => event.preventDefault());
        button.addEventListener('click', () => {
          restoreEditorSelection();
          applyBlockRole('heading', button.dataset.titleSize);
          document.getElementById('title-size-menu').removeAttribute('open');
        });
      });

      document.querySelectorAll('[data-title-number]').forEach((button) => {
        button.addEventListener('mousedown', (event) => event.preventDefault());
        button.addEventListener('click', () => {
          applyTitleNumbering(button.dataset.titleNumber);
          document.getElementById('title-number-menu').removeAttribute('open');
        });
      });

      document.querySelectorAll('[data-theme-color]').forEach((button) => {
        button.addEventListener('mousedown', (event) => event.preventDefault());
        button.addEventListener('click', () => {
          applyTextColor(button.dataset.themeColor);
          document.getElementById('color-palette-menu').removeAttribute('open');
        });
      });

      document.querySelectorAll('[data-font-key]').forEach((button) => {
        button.addEventListener('mousedown', (event) => event.preventDefault());
        button.addEventListener('click', () => {
          restoreEditorSelection();
          applySelectedFont(button.dataset.fontKey);
          document.getElementById('font-family-menu').removeAttribute('open');
        });
      });

      document.querySelectorAll('[data-paragraph-indent]').forEach((button) => {
        button.addEventListener('mousedown', (event) => event.preventDefault());
        button.addEventListener('click', () => {
          applyParagraphIndent(button.dataset.paragraphIndent);
          document.getElementById('paragraph-indent-menu').removeAttribute('open');
        });
      });

      document.querySelectorAll('[data-command]').forEach((button) => {
        button.addEventListener('mousedown', (event) => {
          rememberEditorSelection();
          event.preventDefault();
        });
        button.addEventListener('click', () => {
          const command = button.dataset.command;
          restoreEditorSelection();
          if (command === 'clear') clearFormatting();
          if (command === 'quote') applyQuote();
          if (command === 'bold') applyThemeBold();
          if (command === 'italic') document.execCommand('italic', false, null);
          if (command === 'align-left') document.execCommand('justifyLeft', false, null);
          if (command === 'align-center') document.execCommand('justifyCenter', false, null);
          if (command === 'align-right') document.execCommand('justifyRight', false, null);
          if (command === 'undo') undoEditorChange();
          if (command === 'redo') redoEditorChange();
          updateOutput();
        });
      });

      document.querySelectorAll('[data-mobile-action]').forEach((button) => {
        button.addEventListener('click', () => {
          if (button.dataset.mobileAction === 'identify') basicIdentifyStructure(button);
          if (button.dataset.mobileAction === 'format') formatAll();
          if (button.dataset.mobileAction === 'validate') validateFormat();
          if (button.dataset.mobileAction === 'copy') copyRichText(button);
        });
      });

      const editorObserver = new MutationObserver((mutations) => {
        const hasContentChange = mutations.some((mutation) => !(
          mutation.type === 'attributes' && mutation.attributeName === 'data-format-warning'
        ));
        if (!hasContentChange) return;
        if (guidanceSampleActive && sanitizedEditorHtml() !== guidanceSampleBaselineHtml) dismissGuidanceSample();
        scheduleValidation();
        scheduleEditorHistory();
        if (!documentSearch.hidden) window.requestAnimationFrame(() => updateDocumentSearch(false));
        if (!mobilePublishPreview.hidden) window.requestAnimationFrame(refreshMobilePublishPreview);
      });
      editorObserver.observe(editor, { subtree: true, childList: true, characterData: true, attributes: true });

      applyAppearance(initialAppearance());
      setThemeColor(DEFAULT_THEME_COLOR);
      installEditorResizer();
      renderThemeControls();
      restoreSample();
    })();
  </script>
</body>
</html>
